<script>
const CAT_ID = "cnc-programmering";
const CAT_LABEL = "CNC-programmering";
const QUESTIONS = [
{q:"Vad betyder NC i sammanhanget CNC-teknik?", opts:["Numerical Control (numerisk styrning)", "New Calibration", "Network Connection", "Normal Cutting"], correct:0, fb:"NC står för Numerical Control, alltså numerisk styrning — maskinens rörelser styrs med siffror och koder."},
    {q:"Vad är den huvudsakliga skillnaden mellan NC och CNC?", opts:["Det finns ingen skillnad, orden betyder exakt samma sak i alla sammanhang", "CNC har en inbyggd dator som tolkar och exekverar programmet", "NC används bara för svarvar, CNC bara för fräsar", "CNC kräver alltid manuell styrning av varje rörelse"], correct:1, fb:"CNC (Computer Numerical Control) har en inbyggd dator som läser, tolkar och exekverar programmet samt sköter diagnostik och säkerhetsfunktioner."},
    {q:"Vilken är INTE en fördel med CNC-bearbetning jämfört med konventionell bearbetning?", opts:["Hög repeterbarhet mellan detaljer", "Kortare ställtid", "Att operatören måste styra varje rörelse för hand", "Möjlighet att bearbeta komplexa former"], correct:2, fb:"Att operatören måste styra varje rörelse för hand är kännetecknande för konventionell, manuell bearbetning — inte en fördel med CNC."},
    {q:"Vilka två huvudtyper av CNC-maskiner nämns i materialet?", opts:["Fräsmaskiner/bearbetningscentrum och svarvar/svarvcentrum", "Borrmaskiner och slipmaskiner", "3D-skrivare och laserskärare", "Press och stans"], correct:0, fb:"De två grundläggande maskintyperna är fräsmaskiner/bearbetningscentrum (verktyget roterar) och svarvar/svarvcentrum (arbetsstycket roterar)."},
    {q:"Vad kännetecknar en CNC-svarv jämfört med en fräsmaskin?", opts:["I svarven roterar arbetsstycket medan skärverktyget matas mot det", "I svarven roterar verktyget medan arbetsstycket står still", "Svarven används bara för borrning", "Svarven saknar helt ett koordinatsystem"], correct:0, fb:"På en svarv roterar arbetsstycket medan ett stillastående skärverktyg matas mot det, till skillnad från på en fräsmaskin där verktyget roterar."},
    {q:"Vad är CNC-programmerarens huvudsakliga uppgift?", opts:["Att städa maskinhallen", "Att ta fram bearbetningsprogrammet utifrån ritning, verktyg och skärdata", "Att enbart sköta ekonomin", "Att enbart svara i telefon till kunder"], correct:1, fb:"CNC-programmeraren tar fram bearbetningsprogrammet utifrån ritningen och väljer verktyg, skärdata och bearbetningsstrategi."},
    {q:"Vad är CNC-operatörens huvudsakliga uppgift under produktion?", opts:["Att skriva om hela programmet varje dag", "Att spänna fast material/verktyg, starta och övervaka programmet samt göra mätkontroller", "Att aldrig behöva mäta detaljerna", "Att enbart designa nya maskiner"], correct:1, fb:"Operatören sköter den dagliga driften: fastspänning, uppstart, övervakning av programmet och mätkontroller."},
    {q:"Vad bör man ALDRIG göra medan en CNC-maskin är i drift?", opts:["Ha skyddskåporna stängda", "Sträcka in händerna i arbetsområdet", "Känna till var nödstoppet sitter", "Köra ett nytt program stegvis första gången"], correct:1, fb:"Man ska aldrig sträcka in händerna i arbetsområdet medan maskinen är i drift — det är en grundläggande säkerhetsregel."},
    {q:"Varför körs ofta nya, oprövade program i single block-läge första gången?", opts:["För att spara ström", "För att kunna stoppa och kontrollera efter varje block innan hela programmet körs i full hastighet", "Det finns inget skäl, det görs slumpmässigt", "För att det är obligatoriskt enligt lag i alla länder"], correct:1, fb:"Single block-körning gör att man kan kontrollera varje steg innan man litar på att köra hela programmet i normal hastighet."},
    {q:"Vad innebär hög repeterbarhet i CNC-sammanhang?", opts:["Att maskinen alltid ger samma resultat för samma program, gång på gång", "Att operatören måste upprepa samma kommando manuellt varje gång", "Att programmet måste skrivas om för varje detalj", "Att maskinen bara kan köra ett program en gång totalt"], correct:0, fb:"Repeterbarhet innebär att samma program ger samma resultat om och om igen, vilket är en av CNC-teknikens största fördelar."},
{q:"Vilket koordinatsystem används normalt vid CNC-programmering?", opts:["Det rektangulära (kartesiska) koordinatsystemet", "Ett slumpmässigt talsystem utan axlar", "Enbart polära koordinater utan raka axlar", "Ett system baserat enbart på tid"], correct:0, fb:"CNC-programmering bygger normalt på det rektangulära (kartesiska) koordinatsystemet med räta vinklar mellan axlarna."},
    {q:"Vilka tre huvudaxlar bygger upp det grundläggande koordinatsystemet?", opts:["X, Y och Z", "A, B och C", "N, G och M", "P, Q och R"], correct:0, fb:"De tre huvudaxlarna är X, Y och Z, som tillsammans bildar det rektangulära koordinatsystemet."},
    {q:"Vad kallas den punkt där alla axlars värden är noll?", opts:["Kvadranten", "Origo (nollpunkten)", "Sekvensnumret", "Modalpunkten"], correct:1, fb:"Origo, eller nollpunkten, är den punkt där X-, Y- och Z-värdena alla är noll."},
    {q:"Vad är skillnaden mellan maskinens nollpunkt och programmets nollpunkt?", opts:["Det finns ingen skillnad", "Maskinens nollpunkt är fast och satt av tillverkaren, programmets nollpunkt väljs av programmeraren utifrån ritningen", "Programmets nollpunkt gäller bara för svarvar", "Maskinens nollpunkt ändras varje gång man startar ett nytt program"], correct:1, fb:"Maskinens nollpunkt är fast och satt av tillverkaren, medan programmets/arbetsstyckets nollpunkt väljs av programmeraren utifrån var på detaljen det passar bäst."},
    {q:"Hur många kvadranter delas det rektangulära koordinatsystemet in i?", opts:["Två", "Tre", "Fyra", "Sex"], correct:2, fb:"Koordinatsystemet delas in i fyra kvadranter, beroende på om X- och Y-värdena är positiva eller negativa."},
    {q:"Vad används höger-handsregeln till?", opts:["Att avgöra vilken hand man ska hålla i handhjulet", "Att bestämma de positiva riktningarna på koordinataxlarna", "Att räkna ut materialets densitet", "Att välja rätt skärvätska"], correct:1, fb:"Höger-handsregeln används för att bestämma de positiva riktningarna på X-, Y- och Z-axeln (samt rotationsaxlarna A, B, C)."},
    {q:"Enligt höger-handsregeln, vilket finger representerar den positiva Z-riktningen?", opts:["Tummen", "Pekfingret", "Långfingret, vinkelrätt mot de andra två", "Lillfingret"], correct:2, fb:"Långfingret, hållet vinkelrätt mot tummen (X) och pekfingret (Y), representerar den positiva Z-riktningen."},
    {q:"På en fräsmaskin, vilken axel är normalt parallell med spindelns rotationsaxel?", opts:["X-axeln", "Y-axeln", "Z-axeln", "Ingen av axlarna"], correct:2, fb:"På en fräsmaskin är Z-axeln normalt parallell med spindelns rotationsaxel, och positiv Z pekar bort från arbetsstycket."},
    {q:"På en svarv, hur är X-axeln vanligtvis orienterad?", opts:["Radiellt, mot eller från centrum", "Parallellt med golvet i valfri riktning", "Alltid lodrätt uppåt", "Den existerar inte på en svarv"], correct:0, fb:"På en svarv är X-axeln radiell (mot/från centrum), medan Z-axeln är parallell med spindelns rotationsaxel, längs arbetsstycket."},
    {q:"Vad kan ytterligare axlar som A eller B användas till på en CNC-maskin?", opts:["De används aldrig i praktiken", "De ger möjlighet till rotation för mer komplex bearbetning", "De ersätter alltid X-axeln", "De styr enbart kylmedelsflödet"], correct:1, fb:"Ytterligare rotationsaxlar (t.ex. A eller B) ger möjlighet till mer komplex bearbetning genom att detaljen eller verktyget kan roteras under bearbetningen."},
{q:"Vad är styrsystemets huvudsakliga roll i en CNC-maskin?", opts:["Att läsa programmet, beräkna rörelserna och styra motorerna", "Att enbart visa klockan", "Att ersätta behovet av verktyg", "Att sköta fakturering till kund"], correct:0, fb:"Styrsystemet är maskinens 'hjärna' — det läser programmet, beräknar rörelserna och styr motorerna som utför dem."},
    {q:"Vad används handhjulet på manöverpanelen till?", opts:["Att stänga av hela maskinen permanent", "Finjustering och manuell förflyttning av axlarna, t.ex. vid nollpunktssättning", "Att skriva in hela CNC-programmet", "Att byta verktyg automatiskt"], correct:1, fb:"Handhjulet används för finjustering och manuell förflyttning av axlarna, exempelvis vid inställning av nollpunkten."},
    {q:"Vad avgör styrsystemets parametrar?", opts:["Hur programmet tolkas om inget annat anges", "Hur systemet anpassas efter den specifika maskinen, t.ex. axelhastigheter och mjukvarugränser", "Enbart färgen på skärmen", "Vilka verktyg som finns i verktygsmagasinet"], correct:1, fb:"Parametrarna anpassar styrsystemet efter den specifika maskinen, exempelvis axelhastigheter och mjukvarugränser."},
    {q:"Vad innebär single block-körning?", opts:["Programmet körs ett block i taget, operatören måste trycka igen för nästa block", "Programmet körs baklänges", "Maskinen stänger av sig automatiskt efter ett block", "Endast ett enda block får finnas i hela programmet"], correct:0, fb:"Single block innebär att programmet körs ett block i taget och kräver en ny knapptryckning för varje block, ofta använt vid provkörning."},
    {q:"Vad gör matningsstopp (feedhold)?", opts:["Avslutar programmet permanent", "Pausar matningsrörelsen omedelbart utan att avbryta programmet", "Ökar matningshastigheten kraftigt", "Byter automatiskt verktyg"], correct:1, fb:"Feedhold pausar matningsrörelsen omedelbart, men programmet kan sedan återupptas — det avbryts inte permanent."},
    {q:"Vad händer när nödstoppet aktiveras?", opts:["All rörelse och drivkraft stängs av omedelbart", "Enbart spindeln saktar ner något", "Programmet fortsätter men i lägre hastighet", "Endast skärmen släcks"], correct:0, fb:"Nödstoppet stänger av all rörelse och drivkraft omedelbart vid fara — det är den mest akuta säkerhetsfunktionen."},

const QUIZ_LENGTH = 30;
let order = [];
let idx = 0;
let answered = false;
let score = 0;
let history = [];

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function shuffleOptions(item){
  const pairs = item.opts.map((o, i) => ({ text: o, wasCorrect: i === item.correct }));
  const shuffled = shuffle(pairs);
  const newOpts = shuffled.map(p => p.text);
  const newCorrect = shuffled.findIndex(p => p.wasCorrect);
  return { ...item, opts: newOpts, correct: newCorrect };
}
function buildOrder(){
  return shuffle(QUESTIONS).slice(0, Math.min(QUIZ_LENGTH, QUESTIONS.length)).map(shuffleOptions);
}
function updateProgress(){
  const fill = document.getElementById('progressFill');
  const label = document.getElementById('progressLabel');
  const pct = order.length ? (idx/order.length)*100 : 0;
  fill.style.width = pct + '%';
  label.textContent = Math.min(idx+1, order.length) + ' / ' + order.length;
}
function startQuiz(){
  order = buildOrder();
  idx = 0; score = 0; history = [];
  document.getElementById('poolNote').textContent = `Frågebank: ${QUESTIONS.length} frågor · ${Math.min(QUIZ_LENGTH, QUESTIONS.length)} slumpas ut denna omgång`;
  renderQuestion();
}
function renderQuestion(){
  answered = false;
  updateProgress();
  const card = document.getElementById('card');
  if(idx >= order.length){ renderResult(); return; }
  const item = order[idx];
  const optHtml = item.opts.map((o,i) => {
    const key = String.fromCharCode(65+i);
    return `<button class="opt" data-i="${i}"><span class="k">${key}</span><span>${o}</span></button>`;
  }).join('');
  card.innerHTML = `
    <div class="qmeta">
      <span class="qtag" style="background:var(--page-dim); color:var(--page-accent);">${CAT_LABEL}</span>
      <span class="qnum">Fråga ${idx+1} av ${order.length}</span>
    </div>
    <div class="prompt">${item.q}</div>
    <div class="options">${optHtml}</div>
    <div class="feedback" id="feedback"></div>
    <div class="controls"><button class="next" id="nextBtn" disabled>Nästa</button></div>
  `;
  card.querySelectorAll('.opt').forEach(btn => {
    btn.addEventListener('click', () => selectAnswer(parseInt(btn.dataset.i)));
  });
  document.getElementById('nextBtn').addEventListener('click', () => { idx++; renderQuestion(); });
}
function selectAnswer(i){
  if(answered) return;
  answered = true;
  const item = order[idx];
  const correct = item.correct;
  document.querySelectorAll('.opt').forEach((btn, bi) => {
    btn.setAttribute('disabled','true');
    if(bi === correct) btn.classList.add('correct');
    if(bi === i && i !== correct) btn.classList.add('wrong');
  });
  const isCorrect = (i === correct);
  if(isCorrect) score++;
  history.push({q:item.q, correct:isCorrect, correctText:item.opts[correct]});
  const fb = document.getElementById('feedback');
  fb.classList.add('show', isCorrect ? 'ok' : 'bad');
  fb.innerHTML = `<b>${isCorrect ? 'Rätt!' : 'Inte riktigt.'}</b>${item.fb}`;
  document.getElementById('nextBtn').disabled = false;
}
function renderResult(){
  const card = document.getElementById('card');
  const pct = order.length ? Math.round((score/order.length)*100) : 0;
  const reviewHtml = history.map(h => `
    <div class="review-item ${h.correct ? 'ok' : 'bad'}">
      <div class="q">${h.q}</div>
      <div class="a">${h.correct ? 'Du svarade rätt.' : 'Rätt svar: ' + h.correctText}</div>
    </div>`).join('');
  card.innerHTML = `
    <div class="result">
      <div class="big" style="color:var(--page-accent);">${score} / ${order.length}</div>
      <div class="of">${pct}% rätt</div>
      <button class="restart" id="restartBtn">Kör igen (nya slumpade frågor)</button>
      <div class="review">${reviewHtml}</div>
    </div>`;
  document.getElementById('restartBtn').addEventListener('click', startQuiz);
  document.getElementById('progressFill').style.width = '100%';
  document.getElementById('progressLabel').textContent = order.length + ' / ' + order.length;
}
startQuiz();

</script>
