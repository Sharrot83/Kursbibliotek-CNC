<script>
const CAT_ID = "skarande_bearbetning";
const CAT_LABEL = "Skärande bearbetning";
const QUESTIONS = [
    {q:"Vad är skärande bearbetning?", opts:["Formförändring där material avskiljs i form av spån", "Formförändring genom pressning utan spån", "Sammanfogning av detaljer genom svetsning", "Gjutning av smält metall i form"], correct:0, fb:"Vid skärande bearbetning avskiljs material med verktyg i form av spån."},
    {q:"Vad menas med skärdjup?", opts:["Den skärande eggens ingreppsdjup", "Verktygets förflyttning per tidsenhet", "Rörelsen mellan egg och arbetsstycke", "Antal varv per minut"], correct:0, fb:"Skärdjupet är hur djupt eggen går in i materialet."},
    {q:"Vad är varvtal?", opts:["Skärhastigheten omsatt i rotation av verktyg eller arbetsstycke", "Matningen per minut", "Verktygets livslängd", "Hur många skär verktyget har"], correct:0, fb:"Varvtalet är skärhastigheten uttryckt som rotation."},
    {q:"Varifrån hämtar du skärhastighet och matning?", opts:["Verkstadshandboken eller verktygstillverkarens rekommendationer", "Ritningens titelfält", "Maskinens typskylt", "Man gissar och provar"], correct:0, fb:"Skärdata väljs ur verkstadshandbok och/eller verktygstillverkarens handbok."},
    {q:"Varför kallas supportsvarven så?", opts:["Verktyget stöds av den rörliga släden", "Den har extra stöd under arbetsstycket", "Den används för reservdelar", "Den kräver support från leverantören"], correct:0, fb:"Släden ger verktyget support, därav namnet."},
    {q:"Vilken svarv används för mycket stora arbetsstycken som kraftverksturbiner?", opts:["Karusellsvarv", "Automatsvarv", "Träsvarv", "Bänksvarv"], correct:0, fb:"I karusellsvarven spänns arbetsstycket på en horisontell platta."},
    {q:"Vilken är en stor fördel med horisontella fräsmaskiner?", opts:["Stabil spindel och bra spånhantering", "Spindeln kan vinklas fritt", "De är alltid billigast", "De passar bara små verktyg"], correct:0, fb:"Spindeln tar upp vibrationer bra och spånorna rasar ner och stör inte."},
    {q:"Varför passar vertikala fräsmaskiner med många ställmöjligheter bäst för lättare bearbetning?", opts:["Ställbarheten försämrar stabiliteten", "De har för lite motoreffekt alltid", "De saknar spindel", "De kan inte använda pinnfräsar"], correct:0, fb:"Flexibiliteten ger sämre stabilitet och sämre förmåga att ta upp vibrationer."},
    {q:"Vad kallas en horisontell maskin med vertikaltillsats?", opts:["Kombi- eller duofräsmaskin", "Portalfräs", "Karusellfräs", "Automatfräs"], correct:0, fb:"Kombinationer kallas kombi- eller duofräsmaskiner."},
    {q:"Vad bör du göra dagligen med maskinen om manual saknas?", opts:["Ta bort spånor, torka bort skärvätska och smörja dagliga smörjställen", "Byta all olja", "Demontera skyddskåporna", "Kalibrera alla mätskalor"], correct:0, fb:"Dagligt underhåll: rengör, torka, fyll på olja och smörj dagliga smörjställen."},
    {q:"Vad hör till veckounderhållet?", opts:["Lossa skyddskåpor och bälgar och rengöra noggrant", "Bara sopa golvet", "Byta alla vändskär", "Ingenting om maskinen går bra"], correct:0, fb:"Varje vecka rengörs även det som sitter bakom kåpor och bälgar, och oljenivåer kontrolleras."},
    {q:"Var ska eggen på ett verktyg för utvändig svarvning ligga?", opts:["I eller aningen under centrum", "Aningen över centrum", "Långt under centrum", "Spelar ingen roll"], correct:0, fb:"Utvändigt: i eller aningen under centrum, så att skärvinklarna inte påverkas negativt."},
    {q:"Var ska eggen på ett verktyg för invändig svarvning ligga?", opts:["Aningen över centrum", "Aningen under centrum", "Exakt 1 mm under centrum", "Var som helst"], correct:0, fb:"Invändigt ställs eggen aningen över centrum."},
    {q:"Varför ska svarvverktyg ha kort överhäng?", opts:["Mindre belastning och säkrare avverkning", "För att se bättre", "För att spara material", "Det krävs av ritningen"], correct:0, fb:"Ju kortare överhäng, desto mindre belastning och säkrare avverkning."},
    {q:"Vad kallas en planfräs med 90° ställvinkel?", opts:["Hörnfräs", "Skivfräs", "Profilfräs", "Valsfräs"], correct:0, fb:"En planfräs med 90° ställvinkel kallas också hörnfräs."},
    {q:"Vad är ett borrande pinnfräs?", opts:["En pinnfräs med ett ändskär slipat in till centrum", "En borr med pinnfräsform", "En pinnfräs utan ändskär", "En fräs som bara kan borra"], correct:0, fb:"Den borrande pinnfräsen kan mata rakt ner tack vare ändskäret till centrum."},
    {q:"Vad gäller skärdata för profilverktyg?", opts:["De är i regel lägre än för andra verktyg i samma material", "De är alltid högre", "De är samma som för borrar", "Profilverktyg har inga skärdata"], correct:0, fb:"Profilverktyg körs normalt med lägre skärdata."},
    {q:"Vad är en fördel med spännhylschuck jämfört med weldonhållare?", opts:["Utsticket kan anpassas och udda mått kan spännas", "Den är billigare", "Verktyget behöver urtag på skaftet", "Den har fast diameter"], correct:0, fb:"Spännhylsor har ofta 1 mm spännområde och utsticket går att reglera."},
    {q:"När rekommenderas flytande hållare?", opts:["Vid upprymning och brotschning", "Vid grovfräsning", "Vid lettring", "Vid kapning"], correct:0, fb:"Den låter verktyget följa det förbearbetade hålet så att maskinens brister inte påverkar."},
    {q:"Vad är tumregeln vid utvändig uppspänning i chuck?", opts:["Minst 1×D innanför backarna och högst 2×D utstick", "Minst 2×D inne och högst 1×D ute", "Högst 5 mm inne", "Hela arbetsstycket ska vara inspänt"], correct:0, fb:"Minst en diameter instick och högst två diametrar utstick — annars dubb."},
    {q:"Vad händer vid för kort instick?", opts:["Arbetsstycket kan brytas loss", "Ytfinheten blir bättre", "Varvtalet sjunker", "Ingenting"], correct:0, fb:"För kort instick kan göra att arbetsstycket bryts loss; för långt utstick ger vibrationer."},
    {q:"Vad ska du göra om instick/utstick-regeln inte kan hållas?", opts:["Använda dubb", "Öka varvtalet", "Spänna hårdare", "Använda större verktyg"], correct:0, fb:"Då rekommenderas dubb som stöd."},
    {q:"Vad måste du alltid göra innan du startar en svarv med chuck?", opts:["Ta bort chucknyckeln", "Öppna skyddet", "Lossa backarna", "Smörja dubben"], correct:0, fb:"Ta bort chucknyckeln före start!"},
    {q:"Vad skiljer en backskiva från en självcentrerande chuck?", opts:["Backarna dras åt var för sig", "Den har bara två backar", "Den kan inte spänna utvändigt", "Den är alltid magnetisk"], correct:0, fb:"I backskivan rör sig backarna oberoende, vilket passar asymmetriska arbetsstycken."},
    {q:"Vad är en nackdel med backskiva?", opts:["Många åtdragningsställen och risk för obalans", "Kan inte spänna asymmetriska detaljer", "Har dålig grepp", "Kan bara användas i fräs"], correct:0, fb:"Varje back dras för sig, det kräver mätning och kan ge obalans."},
    {q:"Hur hårt ska dubbdockans dubb dras vid svarvning mellan dubbar?", opts:["Så att arbetsstycket fortfarande kan röras för hand", "Så hårt som möjligt", "Den ska inte vidröra arbetsstycket", "Med momentnyckel till 100 Nm"], correct:0, fb:"Drar man för hårt kan arbetsstycket kröka sig."},
    {q:"När används stödlager?", opts:["Vid mycket långa och tunna arbetsstycken", "Vid korta och grova arbetsstycken", "Vid gängning med gängtapp", "Vid planfräsning"], correct:0, fb:"Stödlagret stadgar upp långa tunna detaljer."},
    {q:"Vad är spännhylsor bäst för?", opts:["Tunna cylindriska arbetsstycken och serietillverkning", "Stora asymmetriska gjutgods", "Plana skivor", "Fyrkantsämnen"], correct:0, fb:"Spännhylsor finns för ca Ø1–20 mm och är snabba vid masstillverkning."},
    {q:"Hur riktar du upp ett skruvstycke parallellt med bordet?", opts:["Indikatorklocka mot fasta backen och justera med plastklubba", "Mät med tumstock", "Rikta mot rörliga backen med ögonmått", "Spänn hårt så rättar det sig självt"], correct:0, fb:"Klockan förs längs fasta backen och skruvstycket justeras tills utslaget är inom tolerans."},
    {q:"Var ska spännskruven placeras vid uppspänning med spännjärn?", opts:["Så nära arbetsstycket som möjligt", "Så nära stödklossen som möjligt", "Mitt emellan", "Det spelar ingen roll"], correct:0, fb:"Då går det mesta av spännkraften mot arbetsstycket."},
    {q:"Varför används parallellbitar i skruvstycket?", opts:["För att detaljen ska hamna på lämplig höjd", "För att skydda backarna", "För att öka spännkraften", "För att kyla detaljen"], correct:0, fb:"Parallellbitarna lyfter detaljen till rätt höjd."},
    {q:"När används en fixtur?", opts:["För oregelbundna detaljer som gjutna ämnen", "Bara för runda detaljer", "För att rikta spindeln", "För att mäta gängor"], correct:0, fb:"Fixturen positionerar oregelbundna detaljer, ofta flera samtidigt."},
    {q:"En delningsapparat har utväxlingen 40:1. Hur många grader vrids arbetsstycket per vevvarv?", opts:["9°", "40°", "4°", "360°"], correct:0, fb:"360° / 40 = 9° per vevvarv."},

const QUIZ_LENGTH = 30;
let order = [];
let idx = 0;
let answered = false;
let score = 0;
let history = [];

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function shuffleOptions(item){
  const pairs = item.opts.map((o, i) => ({ text: o, wasCorrect: i === item.correct }));
  const shuffled = shuffle(pairs);
  const newOpts = shuffled.map(p => p.text);
  const newCorrect = shuffled.findIndex(p => p.wasCorrect);
  return { ...item, opts: newOpts, correct: newCorrect };
}
function buildOrder(){
  return shuffle(QUESTIONS).slice(0, Math.min(QUIZ_LENGTH, QUESTIONS.length)).map(shuffleOptions);
}
function updateProgress(){
  const fill = document.getElementById('progressFill');
  const label = document.getElementById('progressLabel');
  const pct = order.length ? (idx/order.length)*100 : 0;
  fill.style.width = pct + '%';
  label.textContent = Math.min(idx+1, order.length) + ' / ' + order.length;
}
function startQuiz(){
  order = buildOrder();
  idx = 0; score = 0; history = [];
  document.getElementById('poolNote').textContent = `Frågebank: ${QUESTIONS.length} frågor · ${Math.min(QUIZ_LENGTH, QUESTIONS.length)} slumpas ut denna omgång`;
  renderQuestion();
}
function renderQuestion(){
  answered = false;
  updateProgress();
  const card = document.getElementById('card');
  if(idx >= order.length){ renderResult(); return; }
  const item = order[idx];
  const optHtml = item.opts.map((o,i) => {
    const key = String.fromCharCode(65+i);
    return `<button class="opt" data-i="${i}"><span class="k">${key}</span><span>${o}</span></button>`;
  }).join('');
  card.innerHTML = `
    <div class="qmeta">
      <span class="qtag" style="background:var(--page-dim); color:var(--page-accent);">${CAT_LABEL}</span>
      <span class="qnum">Fråga ${idx+1} av ${order.length}</span>
    </div>
    <div class="prompt">${item.q}</div>
    <div class="options">${optHtml}</div>
    <div class="feedback" id="feedback"></div>
    <div class="controls"><button class="next" id="nextBtn" disabled>Nästa</button></div>
  `;
  card.querySelectorAll('.opt').forEach(btn => {
    btn.addEventListener('click', () => selectAnswer(parseInt(btn.dataset.i)));
  });
  document.getElementById('nextBtn').addEventListener('click', () => { idx++; renderQuestion(); });
}
function selectAnswer(i){
  if(answered) return;
  answered = true;
  const item = order[idx];
  const correct = item.correct;
  document.querySelectorAll('.opt').forEach((btn, bi) => {
    btn.setAttribute('disabled','true');
    if(bi === correct) btn.classList.add('correct');
    if(bi === i && i !== correct) btn.classList.add('wrong');
  });
  const isCorrect = (i === correct);
  if(isCorrect) score++;
  history.push({q:item.q, correct:isCorrect, correctText:item.opts[correct]});
  const fb = document.getElementById('feedback');
  fb.classList.add('show', isCorrect ? 'ok' : 'bad');
  fb.innerHTML = `<b>${isCorrect ? 'Rätt!' : 'Inte riktigt.'}</b>${item.fb}`;
  document.getElementById('nextBtn').disabled = false;
}
function renderResult(){
  const card = document.getElementById('card');
  const pct = order.length ? Math.round((score/order.length)*100) : 0;
  const reviewHtml = history.map(h => `
    <div class="review-item ${h.correct ? 'ok' : 'bad'}">
      <div class="q">${h.q}</div>
      <div class="a">${h.correct ? 'Du svarade rätt.' : 'Rätt svar: ' + h.correctText}</div>
    </div>`).join('');
  card.innerHTML = `
    <div class="result">
      <div class="big" style="color:var(--page-accent);">${score} / ${order.length}</div>
      <div class="of">${pct}% rätt</div>
      <button class="restart" id="restartBtn">Kör igen (nya slumpade frågor)</button>
      <div class="review">${reviewHtml}</div>
    </div>`;
  document.getElementById('restartBtn').addEventListener('click', startQuiz);
  document.getElementById('progressFill').style.width = '100%';
  document.getElementById('progressLabel').textContent = order.length + ' / ' + order.length;
}
startQuiz();

</script>
