<script>
const CAT_ID = "toleranser";
const CAT_LABEL = "Toleranser";
const QUESTIONS = [
    {q:"På ritningen står 20 ±1. Inom vilka mått blir detaljen godkänd?", opts:["19–21 mm", "20–21 mm", "19–20 mm", "18–22 mm"], correct:0, fb:"Basmåttet 20 får avvika högst 1 mm uppåt och 1 mm neråt, alltså 19–21 mm."},
    {q:"Vad visar basmåttet på en ritning?", opts:["Detaljens storlek", "Detaljens form", "Hur mycket måttet får avvika", "Vilken maskin som ska användas"], correct:0, fb:"Bilden visar formen, basmåttet storleken och toleransen gränserna för tillåten avvikelse."},
    {q:"Vilket av följande är INTE en fördel med dimensionstoleranser?", opts:["Att alla detaljer blir exakt lika stora", "Lägre tillverkningskostnad", "Bättre funktion", "Enklare reservdelsbyte"], correct:0, fb:"Toleranser ger lägre kostnad, bättre funktion och enklare reservdelsbyte — just för att man inte behöver träffa exakt basmått."},
    {q:"Vad kallas det största mått som kan godkännas?", opts:["Övre gränsmått", "Övre gränsavmått", "Basmått", "Toleransvidd"], correct:0, fb:"Det största godkända måttet är övre gränsmått, det minsta är undre gränsmått."},
    {q:"Vad kallas skillnaden mellan övre och undre gränsmått?", opts:["Toleransvidd", "Lägesavmått", "Noll-linje", "Basmått"], correct:0, fb:"Toleransvidden är toleransområdets höjd, alltså skillnaden mellan övre och undre gränsmått."},
    {q:"Var slutar basmåttets övre pil?", opts:["Mot noll-linjen", "Mot övre toleransgränsen", "Mot undre toleransgränsen", "Mitt i toleransområdet"], correct:0, fb:"Basmåttet slutar mot noll-linjen, som är utgångspunkten för alla avmått."},
    {q:"Hur betecknas området ovanför noll-linjen?", opts:["Positivt (+)", "Negativt (−)", "Noll (0)", "Neutralt (±)"], correct:0, fb:"En detalj som är längre än basmåttet når ovanför noll-linjen — det området är positivt."},
    {q:"En axel har måttet Ø5 ±0,5. Hur stor är toleransvidden?", opts:["1 mm", "0,5 mm", "5 mm", "0,25 mm"], correct:0, fb:"Övre gränsmått 5,5 minus undre gränsmått 4,5 = 1 mm."},
    {q:"Vad kallas måttet från noll-linjen till toleransområdets gräns?", opts:["Gränsavmått", "Gränsmått", "Basmått", "Toleransvidd"], correct:0, fb:"Avståndet från noll-linjen till toleransgränsen är gränsavmåttet — övre eller undre."},
    {q:"Vad anger lägesavmåttet?", opts:["Kortaste avståndet från noll-linjen till toleransområdet", "Toleransområdets höjd", "Detaljens totala längd", "Största godkända mått"], correct:0, fb:"Lägesavmåttet anger toleransläget som kortaste avståndet från noll-linjen till toleransområdet."},
    {q:"En fläns har måttet 12 (−0,2 / −0,5). Mellan vilka mått ska bredden vara?", opts:["11,5–11,8 mm", "11,8–12,2 mm", "12,2–12,5 mm", "11,8–12,0 mm"], correct:0, fb:"12 − 0,5 = 11,5 och 12 − 0,2 = 11,8."},
    {q:"Vad händer med det godkända måttet om lägesavmåttet är positivt?", opts:["Det blir större än basmåttet", "Det blir mindre än basmåttet", "Det blir exakt basmåttet", "Det påverkas inte"], correct:0, fb:"Positivt lägesavmått: toleransområdet ligger över noll-linjen och måttet blir större än basmåttet (överdimension)."},
    {q:"Hur skrivs en symmetrisk tolerans?", opts:["± följt av halva toleransvidden", "± följt av hela toleransvidden", "Bara övre gränsavmåttet", "Med en ISO-bokstav"], correct:0, fb:"Vid symmetrisk tolerans är båda halvorna lika stora, så man skriver ± och halva toleransvidden."},
    {q:"Ett urtag har måttet 30 (+0,08 / 0). Vilken typ av tolerans är det?", opts:["Osymmetrisk", "Symmetrisk", "Generell", "Vinkeltolerans"], correct:0, fb:"Hela toleransområdet ligger på ena sidan av noll-linjen, så toleransen är osymmetrisk."},
    {q:"Varför används över- och underdimensioner?", opts:["För att få lämpliga passningar mellan detaljer", "För att göra ritningen enklare att läsa", "För att slippa mäta detaljen", "För att sänka materialets hårdhet"], correct:0, fb:"Över- och underdimension styr hur detaljer passar ihop — lätt gående eller hårt gripande."},
    {q:"Vilken standard innehåller generella toleranser för längd- och vinkelmått?", opts:["SS-ISO 2768-1", "SS-ISO 286-1", "SS 2142", "ISO 513"], correct:0, fb:"Generella toleranser finns i SS-ISO 2768-1 (tidigare SMS 715)."},
    {q:"Hur ligger toleransområdet vid generella toleranser enligt SS-ISO 2768-1?", opts:["Symmetriskt kring noll-linjen", "Helt över noll-linjen", "Helt under noll-linjen", "Det varierar med klassen"], correct:0, fb:"Generella toleranser är symmetriska och märks med ±."},
    {q:"Vilka fyra toleransklasser finns i SS-ISO 2768-1?", opts:["Fin, medel, grov, mycket grov", "A, B, C, D", "IT1–IT4", "Hård, mjuk, seg, spröd"], correct:0, fb:"Klasserna är f (fin), m (medel), c (grov) och v (mycket grov)."},
    {q:"Ett otoleranssatt mått 40 mm, SS-ISO 2768-m. Vilken tolerans gäller?", opts:["±0,3 mm", "±0,2 mm", "±0,5 mm", "±0,8 mm"], correct:0, fb:"Klass medel, området över 30 t.o.m. 120 mm ger ±0,3 mm."},
    {q:"Vilka mått berörs INTE av den generella toleransen?", opts:["Hjälpmått och teoretiska mått", "Alla diametrar", "Alla mått under 10 mm", "Radier och faser"], correct:0, fb:"Hjälpmått (inom parentes) och teoretiska mått (inramade) berörs inte. Radier och faser ingår däremot."},
    {q:"Hur känner man igen ett hjälpmått på ritningen?", opts:["Det står inom parentes", "Det är inramat", "Det är understruket", "Det står i rött"], correct:0, fb:"Hjälpmått skrivs inom parentes, teoretiska mått är inramade."},
    {q:"Vem tar ansvar för rätt tolerans när generella toleranser används?", opts:["Operatören", "Konstruktören vid varje mått", "Kvalitetschefen", "Ingen — måtten är fria"], correct:0, fb:"Operatören läser i tabellen vilka krav som gäller och tar därmed ansvaret."},
    {q:"Hur skrivs en numerisk tolerans med två gränsavmått?", opts:["Övre gränsavmåttet överst, undre under", "Undre överst, övre under", "Bredvid varandra med snedstreck", "Alltid som ± värde"], correct:0, fb:"Det övre gränsavmåttet skrivs överst och det undre under, både för invändiga och utvändiga mått."},
    {q:"Ett gränsavmått är noll. Hur skrivs det?", opts:["Bara 0", "0,00 med lika många decimaler", "±0", "Det skrivs inte alls"], correct:0, fb:"Lika många decimaler gäller för båda gränsavmåtten — utom gränsavmåttet noll som bara skrivs 0."},
    {q:"Hur många minuter är en vinkelgrad?", opts:["60", "100", "360", "10"], correct:0, fb:"En grad = 60 minuter och en minut = 60 sekunder."},
    {q:"Vilken sida räknas som längd vid generella vinkeltoleranser?", opts:["Den kortaste sidan i vinkeln", "Den längsta sidan", "Summan av sidorna", "Diagonalen"], correct:0, fb:"Längdområdet bestäms av den kortaste sidan i toleransvinkeln."},
    {q:"En vinkel med kortaste ben 40 mm, SS-ISO 2768-m. Vilken vinkeltolerans gäller?", opts:["±0°30′", "±1°", "±0°20′", "±0°10′"], correct:0, fb:"Klass m och längdområdet över 10 t.o.m. 50 mm ger ±0°30′."},
    {q:"Enligt SMS 723 gäller e = ±6 mm (klass B). Vinkelbenet L är 1500 mm. Tillåten måttavvikelse?", opts:["±9 mm", "±6 mm", "±1,5 mm", "±15 mm"], correct:0, fb:"e · L / 1000 = 6 · 1500 / 1000 = ±9 mm."},
    {q:"I ISO-symbolen 25H7, vad betyder bokstaven H?", opts:["Toleransläget", "Toleransgraden", "Basmåttet", "Materialet"], correct:0, fb:"Bokstaven anger toleransläget, siffran toleransgraden."},
    {q:"I ISO-symbolen 25H7, vad betyder siffran 7?", opts:["Toleransgraden", "Toleransläget", "Antal decimaler", "Toleransklassen i SS-ISO 2768"], correct:0, fb:"Siffran är toleransgraden, som motsvarar en viss toleransvidd."},
    {q:"Vilka bokstäver används för hål?", opts:["Stora bokstäver A–Z", "Små bokstäver a–z", "Grekiska bokstäver", "Siffror"], correct:0, fb:"Stora bokstäver för hål och invändiga mått, små för axlar och utvändiga mått."},
    {q:"Vilket toleransläge har lägesavmåttet noll och används för bashål?", opts:["H", "A", "Z", "JS"], correct:0, fb:"H (och h för axlar) har lägesavmåttet noll — toleransområdet startar från noll-linjen."},
    {q:"Vad betyder JS/js?", opts:["Symmetrisk tolerans kring noll-linjen", "Störst möjliga spel", "Mycket grov tolerans", "Japansk standard"], correct:0, fb:"JS för hål och js för axlar betecknar symmetrisk tolerans (s = symmetri)."},
    {q:"Hur påverkar toleranslägen A–H ett hål?", opts:["Hålet blir aningen större än basmåttet", "Hålet blir aningen mindre än basmåttet", "Hålet blir exakt basmåttet", "De påverkar bara ytjämnheten"], correct:0, fb:"A–H ger hålet en diameter aningen större än basmåttet, störst vid A."},
    {q:"Hur påverkar toleranslägen k–z en axel?", opts:["Axeln blir aningen större än basmåttet", "Axeln blir aningen mindre än basmåttet", "Axeln blir exakt basmåttet", "Axeln blir konisk"], correct:0, fb:"k–z ger axeln en diameter aningen större än basmåttet, störst vid z."},

const QUIZ_LENGTH = 30;
let order = [];
let idx = 0;
let answered = false;
let score = 0;
let history = [];

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function shuffleOptions(item){
  const pairs = item.opts.map((o, i) => ({ text: o, wasCorrect: i === item.correct }));
  const shuffled = shuffle(pairs);
  const newOpts = shuffled.map(p => p.text);
  const newCorrect = shuffled.findIndex(p => p.wasCorrect);
  return { ...item, opts: newOpts, correct: newCorrect };
}
function buildOrder(){
  return shuffle(QUESTIONS).slice(0, Math.min(QUIZ_LENGTH, QUESTIONS.length)).map(shuffleOptions);
}
function updateProgress(){
  const fill = document.getElementById('progressFill');
  const label = document.getElementById('progressLabel');
  const pct = order.length ? (idx/order.length)*100 : 0;
  fill.style.width = pct + '%';
  label.textContent = Math.min(idx+1, order.length) + ' / ' + order.length;
}
function startQuiz(){
  order = buildOrder();
  idx = 0; score = 0; history = [];
  document.getElementById('poolNote').textContent = `Frågebank: ${QUESTIONS.length} frågor · ${Math.min(QUIZ_LENGTH, QUESTIONS.length)} slumpas ut denna omgång`;
  renderQuestion();
}
function renderQuestion(){
  answered = false;
  updateProgress();
  const card = document.getElementById('card');
  if(idx >= order.length){ renderResult(); return; }
  const item = order[idx];
  const optHtml = item.opts.map((o,i) => {
    const key = String.fromCharCode(65+i);
    return `<button class="opt" data-i="${i}"><span class="k">${key}</span><span>${o}</span></button>`;
  }).join('');
  card.innerHTML = `
    <div class="qmeta">
      <span class="qtag" style="background:var(--page-dim); color:var(--page-accent);">${CAT_LABEL}</span>
      <span class="qnum">Fråga ${idx+1} av ${order.length}</span>
    </div>
    <div class="prompt">${item.q}</div>
    <div class="options">${optHtml}</div>
    <div class="feedback" id="feedback"></div>
    <div class="controls"><button class="next" id="nextBtn" disabled>Nästa</button></div>
  `;
  card.querySelectorAll('.opt').forEach(btn => {
    btn.addEventListener('click', () => selectAnswer(parseInt(btn.dataset.i)));
  });
  document.getElementById('nextBtn').addEventListener('click', () => { idx++; renderQuestion(); });
}
function selectAnswer(i){
  if(answered) return;
  answered = true;
  const item = order[idx];
  const correct = item.correct;
  document.querySelectorAll('.opt').forEach((btn, bi) => {
    btn.setAttribute('disabled','true');
    if(bi === correct) btn.classList.add('correct');
    if(bi === i && i !== correct) btn.classList.add('wrong');
  });
  const isCorrect = (i === correct);
  if(isCorrect) score++;
  history.push({q:item.q, correct:isCorrect, correctText:item.opts[correct]});
  const fb = document.getElementById('feedback');
  fb.classList.add('show', isCorrect ? 'ok' : 'bad');
  fb.innerHTML = `<b>${isCorrect ? 'Rätt!' : 'Inte riktigt.'}</b>${item.fb}`;
  document.getElementById('nextBtn').disabled = false;
}
function renderResult(){
  const card = document.getElementById('card');
  const pct = order.length ? Math.round((score/order.length)*100) : 0;
  const reviewHtml = history.map(h => `
    <div class="review-item ${h.correct ? 'ok' : 'bad'}">
      <div class="q">${h.q}</div>
      <div class="a">${h.correct ? 'Du svarade rätt.' : 'Rätt svar: ' + h.correctText}</div>
    </div>`).join('');
  card.innerHTML = `
    <div class="result">
      <div class="big" style="color:var(--page-accent);">${score} / ${order.length}</div>
      <div class="of">${pct}% rätt</div>
      <button class="restart" id="restartBtn">Kör igen (nya slumpade frågor)</button>
      <div class="review">${reviewHtml}</div>
    </div>`;
  document.getElementById('restartBtn').addEventListener('click', startQuiz);
  document.getElementById('progressFill').style.width = '100%';
  document.getElementById('progressLabel').textContent = order.length + ' / ' + order.length;
}
startQuiz();

</script>
