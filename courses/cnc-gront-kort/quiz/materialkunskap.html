<script>
const CAT_ID = "materialkunskap";
const CAT_LABEL = "Materialkunskap";
const QUESTIONS = [
{q:"Vad kallas de material en produkts detaljer är tillverkade av?", opts:["Konstruktionsmaterial", "Slaggprodukter", "Gråberg", "Halvledare"], correct:0, fb:"Delar i en produkt tillverkas av så kallade konstruktionsmaterial, valda utifrån funktion och ekonomi."},
    {q:"Vilka två huvudfaktorer styr valet av material till en produkt?", opts:["Funktion och ekonomi", "Färg och doft", "Vikt och doft", "Ålder och form"], correct:0, fb:"Material väljs med tanke på funktion (vad produkten ska användas till) och ekonomi (kostnad för tillverkning och personal)."},
    {q:"Vad kan hända vid ett felaktigt materialval?", opts:["Materialet överbelastas och går sönder", "Produkten blir alltid billigare", "Inget särskilt, materialval saknar betydelse", "Produkten blir automatiskt starkare"], correct:0, fb:"Ett felaktigt materialval kan leda till att materialet överbelastas och går sönder."},
    {q:"Vad menas med att 'sätta rätt material på rätt plats'?", opts:["Att välja den bästa kombinationen av olika material eftersom inget material har alla önskvärda egenskaper samtidigt", "Att alltid använda samma material i hela produkten", "Att bara tänka på priset, aldrig på funktionen", "Att aldrig kombinera flera material i samma produkt"], correct:0, fb:"Eftersom inget enskilt material har alla önskvärda egenskaper samtidigt får man välja den bästa kombinationen och sätta rätt material på rätt plats."},
    {q:"Vilket är INTE en av de önskvärda egenskaperna som nämns för material i en produkt?", opts:["Starka och lätta", "Lämpliga att bearbeta och sammanfoga", "Så dyra som möjligt att köpa in", "Lätta att återanvända vid skrotning"], correct:2, fb:"Ett material bör vara billigt att använda (lågt inköpspris och låg bearbetningskostnad) — inte så dyrt som möjligt."},
    {q:"Ett typiskt exempel som nämns på en produkt med många olika material är:", opts:["En bil", "En sten", "Ett glas vatten", "Ett träd"], correct:0, fb:"En bil innehåller bland annat aluminium, gummi, plast, stål och tunnplåt, alla valda med tanke på funktion och hållbarhet."},
    {q:"Vart går den största delen av världens energiförbrukning enligt materialet?", opts:["Till utvinning och förädling av material", "Till belysning i hemmen", "Till matlagning", "Till tillverkning av kläder"], correct:0, fb:"Den största delen av den energi som förbrukas i världen går åt till utvinning och förädling av material."},
    {q:"Ungefär hur stor andel av energin krävs för att smälta om aluminiumskrot jämfört med att nyframställa aluminium ur bauxit?", opts:["Cirka 5 %", "Cirka 50 %", "Cirka 95 %", "Exakt lika mycket"], correct:0, fb:"Att smälta om aluminiumskrot kräver bara ungefär 5 % av energin som går åt vid nyframställning ur bauxit, vilket gör återvinning mycket energieffektivt."},
{q:"Vad kallas mineraler som innehåller utvinningsbara metaller?", opts:["Malmer", "Halvledare", "Legeringar", "Isolatorer"], correct:0, fb:"Mineraler som innehåller utvinningsbara metaller kallas malmer."},
    {q:"Vad kallas det värdelösa material som måste avskiljas från metallen i malmen?", opts:["Gråberg", "Anlöpning", "Martensit", "Perlit"], correct:0, fb:"Metaller förekommer aldrig rena i naturen utan är blandade med gråberg som måste tas bort."},
    {q:"Vilka två malmer nämns som de viktigaste i Sverige, och vilken metall ger de?", opts:["Svartmalm och blodstensmalm — järn", "Bauxit och kopparkis — aluminium", "Blyglans och guldmalm — bly", "Zinkmalm och nickelmalm — zink"], correct:0, fb:"De viktigaste malmerna i Sverige är svartmalm och blodstensmalm, som ger järn."},
    {q:"I vilken anläggning befrias järnmalmen från syre så att endast järn (råstål) finns kvar?", opts:["En masugn", "Ett kylskåp", "En pendelhejare", "En dragprovningsmaskin"], correct:0, fb:"I ett järnverk befrias malmen från syre i en masugn, så att endast järn (råstål) finns kvar."},
    {q:"Vilka egenskaper kännetecknar metaller (jämfört med icke-metaller)?", opts:["Leder elektricitet bra och är glansiga/reflekterar ljus bra", "Leder elektricitet dåligt och är matta", "Är alltid flytande vid rumstemperatur", "Kan aldrig kombineras med andra grundämnen"], correct:0, fb:"Metaller leder elektricitet bra och är glansiga med god ljusreflektion — nästan alla är dessutom fasta vid rumstemperatur (utom kvicksilver)."},
    {q:"Vad kallas grundämnen som har egenskaper mitt emellan metaller och icke-metaller, t.ex. arsenik och germanium?", opts:["Halvmetaller eller halvledare", "Legeringar", "Malmer", "Tungmetaller"], correct:0, fb:"Grundämnen med egenskaper mitt emellan metaller och icke-metaller kallas halvmetaller eller halvledare."},
    {q:"Vad är en legering?", opts:["En blandning av en metall med ett eller flera andra grundämnen", "Ett rent grundämne utan tillsatser", "Ett annat namn för gråberg", "En typ av oförstörande provning"], correct:0, fb:"En legering är en blandning av en metall med ett eller flera andra grundämnen, t.ex. stål (järn + kol) eller mässing (koppar + zink)."},
    {q:"Vilken kromhalt krävs ungefär för att stål ska bli rostfritt?", opts:["Minst 12 %", "Minst 1 %", "Minst 50 %", "Krom påverkar inte rostfrihet"], correct:0, fb:"Minst 12 % krom som legeringsämne gör stålet rostfritt."},
{q:"Hur beräknas ett materials densitet?", opts:["Vikt dividerat med volym", "Volym dividerat med vikt", "Vikt multiplicerat med temperatur", "Smältpunkt dividerat med hårdhet"], correct:0, fb:"Densitet beräknas som vikt dividerat med volym, uttryckt i t.ex. kg/dm³."},
    {q:"Vilken gräns skiljer normalt lättmetaller från tungmetaller?", opts:["Lättmetaller under 4,5 kg/dm³, tungmetaller från 6,7 kg/dm³", "Lättmetaller över 10 kg/dm³", "Det finns ingen sådan gräns", "Gränsen sätts av smältpunkten, inte densiteten"], correct:0, fb:"Lättmetaller har densitet under 4,5 kg/dm³, medan tungmetaller har densitet från 6,7 kg/dm³ och uppåt."},
    {q:"Vad kallas temperaturen då ett material övergår från fast till flytande form?", opts:["Smältpunkt", "Densitet", "Slagseghet", "Korrosionsgräns"], correct:0, fb:"Smältpunkten är temperaturen då materialet smälter och övergår från fast till flytande form."},
    {q:"Varför är kunskap om värmeutvidgning viktig vid t.ex. svarvning?", opts:["Materialet expanderar när det värms av bearbetningen, vilket kan ge fel mått vid mätning innan det svalnat", "Värmeutvidgning påverkar aldrig mätresultat", "Det gäller bara vid extremt låga temperaturer", "Endast plaster påverkas av värmeutvidgning"], correct:0, fb:"Materialet blir varmt och expanderar under bearbetning, vilket kan ge missvisande mått om man mäter innan det hunnit svalna."},
    {q:"Vilken metall nämns ha bäst värmeledningsförmåga och därför används i värmeväxlare och kylare?", opts:["Koppar", "Bly", "Plast", "Trä"], correct:0, fb:"Koppar har bäst värmeledningsförmåga bland de vanliga metallerna och används därför i värmeväxlare och kylare."},
    {q:"Varför används plast ofta som elektrisk isolator?", opts:["Plast är en dålig elektrisk ledare", "Plast leder el bättre än koppar", "Plast har högst densitet av alla material", "Plast smälter aldrig"], correct:0, fb:"Plaster är oftast dåliga elektriska ledare och används därför som isolatorer runt t.ex. elkablar."},
    {q:"Vad kallas materialets förmåga att motstå angrepp från t.ex. syror och saltvatten?", opts:["Korrosionsmotstånd", "Slitstyrka", "Densitet", "Smältintervall"], correct:0, fb:"Korrosionsmotstånd är materialets förmåga att motstå miljöpåverkan som syror, alkalier och saltvatten."},
    {q:"Vad beskriver begreppet slitstyrka?", opts:["Materialets motstånd mot nötning när ytor gnids mot varandra", "Materialets förmåga att leda värme", "Materialets vikt per volymenhet", "Materialets färg efter bearbetning"], correct:0, fb:"Slitstyrka beskriver hur väl materialytan står emot nötning, till exempel när grus ligger på ett lastbilsflak."},
{q:"Vilka tre värden får man vanligen fram ur en dragprovning?", opts:["Sträckgräns, brottgräns och brottförlängning", "Densitet, smältpunkt och hårdhet", "Färg, doft och ljud", "Kolhalt, kromhalt och nickelhalt"], correct:0, fb:"Dragprovning ger sträckgräns, brottgräns och brottförlängning — grundläggande hållfasthetsbegrepp."},
    {q:"Vad kallas den belastning materialet tål utan att få en bestående formförändring?", opts:["Sträckgräns", "Brottgräns", "Brottförlängning", "Utmattningsgräns"], correct:0, fb:"Sträckgränsen är den belastning materialet tål utan kvarstående formförändring — provbiten återgår till sin ursprungliga form efteråt."},
    {q:"Vad mäter en slagprovning?", opts:["Materialets slagseghet, dvs. förmåga att stå emot slag utan att brista", "Materialets densitet", "Materialets färgkod", "Materialets smältpunkt"], correct:0, fb:"Slagprovning mäter slagsegheten — materialets förmåga att motstå slag utan att brista."},
    {q:"Vad avslöjar en utmattningsprovning?", opts:["Hur materialet klarar upprepad, växlande belastning över tid", "Materialets täthet", "Materialets ytfärg", "Materialets elektriska ledningsförmåga"], correct:0, fb:"Utmattningsprovning visar hur materialet klarar upprepad växlande belastning, även vid belastningar under brottgränsen."},
    {q:"Vad studeras vid mikroskopering av ett material?", opts:["Kornstorlek, utskiljningar och mikrosprickor", "Materialets pris", "Materialets ljudnivå", "Materialets doft"], correct:0, fb:"Vid mikroskopering studeras materialets struktur — kornstorlek, utskiljningar och mikrosprickor — i kraftig förstoring."},

];

const QUIZ_LENGTH = 30;
let order = [];
let idx = 0;
let answered = false;
let score = 0;
let history = [];

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function shuffleOptions(item){
  const pairs = item.opts.map((o, i) => ({ text: o, wasCorrect: i === item.correct }));
  const shuffled = shuffle(pairs);
  const newOpts = shuffled.map(p => p.text);
  const newCorrect = shuffled.findIndex(p => p.wasCorrect);
  return { ...item, opts: newOpts, correct: newCorrect };
}
function buildOrder(){
  return shuffle(QUESTIONS).slice(0, Math.min(QUIZ_LENGTH, QUESTIONS.length)).map(shuffleOptions);
}
function updateProgress(){
  const fill = document.getElementById('progressFill');
  const label = document.getElementById('progressLabel');
  const pct = order.length ? (idx/order.length)*100 : 0;
  fill.style.width = pct + '%';
  label.textContent = Math.min(idx+1, order.length) + ' / ' + order.length;
}
function startQuiz(){
  order = buildOrder();
  idx = 0; score = 0; history = [];
  document.getElementById('poolNote').textContent = `Frågebank: ${QUESTIONS.length} frågor · ${Math.min(QUIZ_LENGTH, QUESTIONS.length)} slumpas ut denna omgång`;
  renderQuestion();
}
function renderQuestion(){
  answered = false;
  updateProgress();
  const card = document.getElementById('card');
  if(idx >= order.length){ renderResult(); return; }
  const item = order[idx];
  const optHtml = item.opts.map((o,i) => {
    const key = String.fromCharCode(65+i);
    return `<button class="opt" data-i="${i}"><span class="k">${key}</span><span>${o}</span></button>`;
  }).join('');
  card.innerHTML = `
    <div class="qmeta">
      <span class="qtag" style="background:var(--page-dim); color:var(--page-accent);">${CAT_LABEL}</span>
      <span class="qnum">Fråga ${idx+1} av ${order.length}</span>
    </div>
    <div class="prompt">${item.q}</div>
    <div class="options">${optHtml}</div>
    <div class="feedback" id="feedback"></div>
    <div class="controls"><button class="next" id="nextBtn" disabled>Nästa</button></div>
  `;
  card.querySelectorAll('.opt').forEach(btn => {
    btn.addEventListener('click', () => selectAnswer(parseInt(btn.dataset.i)));
  });
  document.getElementById('nextBtn').addEventListener('click', () => { idx++; renderQuestion(); });
}
function selectAnswer(i){
  if(answered) return;
  answered = true;
  const item = order[idx];
  const correct = item.correct;
  document.querySelectorAll('.opt').forEach((btn, bi) => {
    btn.setAttribute('disabled','true');
    if(bi === correct) btn.classList.add('correct');
    if(bi === i && i !== correct) btn.classList.add('wrong');
  });
  const isCorrect = (i === correct);
  if(isCorrect) score++;
  history.push({q:item.q, correct:isCorrect, correctText:item.opts[correct]});
  const fb = document.getElementById('feedback');
  fb.classList.add('show', isCorrect ? 'ok' : 'bad');
  fb.innerHTML = `<b>${isCorrect ? 'Rätt!' : 'Inte riktigt.'}</b>${item.fb}`;
  document.getElementById('nextBtn').disabled = false;
}
function renderResult(){
  const card = document.getElementById('card');
  const pct = order.length ? Math.round((score/order.length)*100) : 0;
  const reviewHtml = history.map(h => `
    <div class="review-item ${h.correct ? 'ok' : 'bad'}">
      <div class="q">${h.q}</div>
      <div class="a">${h.correct ? 'Du svarade rätt.' : 'Rätt svar: ' + h.correctText}</div>
    </div>`).join('');
  card.innerHTML = `
    <div class="result">
      <div class="big" style="color:var(--page-accent);">${score} / ${order.length}</div>
      <div class="of">${pct}% rätt</div>
      <button class="restart" id="restartBtn">Kör igen (nya slumpade frågor)</button>
      <div class="review">${reviewHtml}</div>
    </div>`;
  document.getElementById('restartBtn').addEventListener('click', startQuiz);
  document.getElementById('progressFill').style.width = '100%';
  document.getElementById('progressLabel').textContent = order.length + ' / ' + order.length;
}
startQuiz();

</script>
