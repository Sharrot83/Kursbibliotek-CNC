<script>
const CAT_ID = "kvalitet";
const CAT_LABEL = "Vad är kvalitet?";
const QUESTIONS = [
    {q:"Vad menas med 'rätt kvalitet' enligt materialet?", opts:["Att produkten tillfredsställer användarens/kundens krav, behov, önskemål och förväntningar", "Att produkten är så dyr och exklusiv som möjligt", "Att produkten är billigast på marknaden", "Att produkten är tillverkad enligt senaste modet"], correct:0, fb:"Rätt kvalitet innebär att produkten tillfredsställer användarens eller kundens krav, behov, önskemål och förväntningar – inte att den är dyrast eller billigast."},
    {q:"Varför pratar man idag hellre om 'rätt kvalitet' än 'hög kvalitet'?", opts:["Eftersom kvalitet upplevs olika av olika människor och i olika tider", "Eftersom hög kvalitet alltid är för dyrt", "Eftersom ordet kvalitet inte längre används", "Eftersom lagen kräver det"], correct:0, fb:"Kvalitet upplevs olika beroende på person, plats och tid, så 'rätt kvalitet' är ett mer träffande begrepp än 'hög kvalitet'."},
    {q:"Vad illustrerar exemplet med grevinnan och betjänten?", opts:["Att dyra bilar alltid är bättre", "Att olika kunder kan ha rätt kvalitet i helt olika produkter, beroende på deras behov", "Att alla vill ha samma sorts bil", "Att kvalitet enbart handlar om pris"], correct:1, fb:"Grevinnan vill ha en Rolls Royce, betjänten en enkel bil han kan laga själv – båda kan ha rätt kvalitet, fast för olika personer och behov."},
    {q:"Vad visar exemplet med torparen Larsson och hans barnbarnsbarn Jan?", opts:["Att kvalitet är detsamma oavsett tidsepok", "Att kvalitetsnivån och önskemål förändras med tiden", "Att gamla lösningar alltid är bättre", "Att vattenpumpar aldrig blir omoderna"], correct:1, fb:"Larsson önskade en gårdspump för 100 år sedan, medan Jan idag vill ha en elektrisk pumpautomat – vad som är rätt kvalitet ändras med tiden."},
    {q:"Vilka tre bilar nämns som exempel på att rätt kvalitet beror på sammanhang?", opts:["Lada Samara, Renault Clio och Volvo 945", "Volvo, Saab och Scania", "Tesla, BMW och Toyota", "Ford, Fiat och Skoda"], correct:0, fb:"Lada Samara passar en taxichaufför i Moskva, Renault Clio trängseltrafik i storstad, och Volvo 945 svenska landsvägar – alla tre kan ha rätt kvalitet i sitt sammanhang."},
    {q:"Hur definierar svensk standard ordet kvalitet?", opts:["Alla sammantagna egenskaper hos en produkt som ger dess förmåga att tillfredsställa uttalade eller underförstådda behov", "Produktens pris i förhållande till konkurrenterna", "Antalet funktioner en produkt har", "Hur länge en produkt håller"], correct:0, fb:"Enligt svensk standard är kvalitet alla sammantagna egenskaper som ger produktens förmåga att tillfredsställa uttalade eller underförstådda behov."},

    {q:"Vad är FMEA?", opts:["En metod för teoretisk provning av möjliga felorsaker och deras effekter", "Ett certifikat för leverantörer", "En typ av kvalitetspolicy", "Ett mätinstrument"], correct:0, fb:"FMEA (Failure Mode and Effect Analysis) är en metod för att teoretiskt pröva möjliga felorsaker och deras effekter med särskilda protokoll."},

const QUIZ_LENGTH = 30;
let order = [];
let idx = 0;
let answered = false;
let score = 0;
let history = [];

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function shuffleOptions(item){
  const pairs = item.opts.map((o, i) => ({ text: o, wasCorrect: i === item.correct }));
  const shuffled = shuffle(pairs);
  const newOpts = shuffled.map(p => p.text);
  const newCorrect = shuffled.findIndex(p => p.wasCorrect);
  return { ...item, opts: newOpts, correct: newCorrect };
}
function buildOrder(){
  return shuffle(QUESTIONS).slice(0, Math.min(QUIZ_LENGTH, QUESTIONS.length)).map(shuffleOptions);
}
function updateProgress(){
  const fill = document.getElementById('progressFill');
  const label = document.getElementById('progressLabel');
  const pct = order.length ? (idx/order.length)*100 : 0;
  fill.style.width = pct + '%';
  label.textContent = Math.min(idx+1, order.length) + ' / ' + order.length;
}
function startQuiz(){
  order = buildOrder();
  idx = 0; score = 0; history = [];
  document.getElementById('poolNote').textContent = `Frågebank: ${QUESTIONS.length} frågor · ${Math.min(QUIZ_LENGTH, QUESTIONS.length)} slumpas ut denna omgång`;
  renderQuestion();
}
function renderQuestion(){
  answered = false;
  updateProgress();
  const card = document.getElementById('card');
  if(idx >= order.length){ renderResult(); return; }
  const item = order[idx];
  const optHtml = item.opts.map((o,i) => {
    const key = String.fromCharCode(65+i);
    return `<button class="opt" data-i="${i}"><span class="k">${key}</span><span>${o}</span></button>`;
  }).join('');
  card.innerHTML = `
    <div class="qmeta">
      <span class="qtag" style="background:var(--page-dim); color:var(--page-accent);">${CAT_LABEL}</span>
      <span class="qnum">Fråga ${idx+1} av ${order.length}</span>
    </div>
    <div class="prompt">${item.q}</div>
    <div class="options">${optHtml}</div>
    <div class="feedback" id="feedback"></div>
    <div class="controls"><button class="next" id="nextBtn" disabled>Nästa</button></div>
  `;
  card.querySelectorAll('.opt').forEach(btn => {
    btn.addEventListener('click', () => selectAnswer(parseInt(btn.dataset.i)));
  });
  document.getElementById('nextBtn').addEventListener('click', () => { idx++; renderQuestion(); });
}
function selectAnswer(i){
  if(answered) return;
  answered = true;
  const item = order[idx];
  const correct = item.correct;
  document.querySelectorAll('.opt').forEach((btn, bi) => {
    btn.setAttribute('disabled','true');
    if(bi === correct) btn.classList.add('correct');
    if(bi === i && i !== correct) btn.classList.add('wrong');
  });
  const isCorrect = (i === correct);
  if(isCorrect) score++;
  history.push({q:item.q, correct:isCorrect, correctText:item.opts[correct]});
  const fb = document.getElementById('feedback');
  fb.classList.add('show', isCorrect ? 'ok' : 'bad');
  fb.innerHTML = `<b>${isCorrect ? 'Rätt!' : 'Inte riktigt.'}</b>${item.fb}`;
  document.getElementById('nextBtn').disabled = false;
}
function renderResult(){
  const card = document.getElementById('card');
  const pct = order.length ? Math.round((score/order.length)*100) : 0;
  const reviewHtml = history.map(h => `
    <div class="review-item ${h.correct ? 'ok' : 'bad'}">
      <div class="q">${h.q}</div>
      <div class="a">${h.correct ? 'Du svarade rätt.' : 'Rätt svar: ' + h.correctText}</div>
    </div>`).join('');
  card.innerHTML = `
    <div class="result">
      <div class="big" style="color:var(--page-accent);">${score} / ${order.length}</div>
      <div class="of">${pct}% rätt</div>
      <button class="restart" id="restartBtn">Kör igen (nya slumpade frågor)</button>
      <div class="review">${reviewHtml}</div>
    </div>`;
  document.getElementById('restartBtn').addEventListener('click', startQuiz);
  document.getElementById('progressFill').style.width = '100%';
  document.getElementById('progressLabel').textContent = order.length + ' / ' + order.length;
}
startQuiz();
</script>
