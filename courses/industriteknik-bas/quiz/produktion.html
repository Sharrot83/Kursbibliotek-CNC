    <div class="sub">Öva på frågor från <a href="../material/produktion.html" style="color:var(--page-accent); font-weight:600;">läsmaterialet om produktionsteknik och 5S</a>. Frågorna och svarsalternativen slumpas varje omgång.</div>

<script>
const CAT_ID = "produktion";
const CAT_LABEL = "Produktionsteknik";
const QUESTIONS = [
    {q:"Vad handlar produktionsteknik om enligt materialet?", opts:["Att omvandla råmaterial och insatsvaror till färdiga produkter med rätt kvalitet, i rätt tid och till rätt kostnad","Att enbart sköta marknadsföring av produkter","Att bara hantera personalens löner","Att designa produktens förpackning"], correct:0, fb:"Produktionsteknik spänner från val av tillverkningsmetod till hur en hel fabrik planeras och styrs."},
    {q:"Vilka tre delvis överlappande områden delas produktionstekniken ofta in i?", opts:["Tillverkningsteknik, produktionssystem och produktionsstyrning","Marknadsföring, ekonomi och juridik","Design, färgval och materialval","Transport, lagring och försäljning"], correct:0, fb:"Tillverkningsteknik är de fysiska metoderna, produktionssystem hur allt organiseras, och produktionsstyrning hur man planerar och följer upp."},
    {q:"Vad kännetecknar styckproduktion?", opts:["Varje produkt eller ett fåtal exemplar tillverkas efter kundens specifika önskemål, med hög flexibilitet men hög styckkostnad","Produktionen pågår kontinuerligt dygnet runt utan stopp","Alla produkter är identiska och tillverkas i mycket höga volymer","Produktionen kräver aldrig omställning av maskiner"], correct:0, fb:"Styckproduktion, t.ex. prototyper, kräver flexibel utrustning eftersom nästa jobb kan se helt annorlunda ut."},
    {q:"Vad är processproduktion (kontinuerlig produktion)?", opts:["Produktion som pågår kontinuerligt utan tydliga start- och stoppunkter, t.ex. papper eller stål i smält form","Produktion av unika prototyper","Produktion som alltid görs för hand","Produktion som bara sker vid behov"], correct:0, fb:"Processproduktion ger hög effektivitet men mycket låg flexibilitet eftersom utrustningen är specialiserad för ett flöde."},
    {q:"Vad kännetecknar en funktionell verkstad (processlayout)?", opts:["Maskiner av samma typ grupperas tillsammans, vilket ger långa transportsträckor och mycket produkter i arbete","Maskinerna placeras i bearbetningsordning längs en linje","En liten grupp maskiner tillverkar en produktfamilj från början till slut","Det finns bara en enda maskin i hela fabriken"], correct:0, fb:"Funktionell verkstad passar styckproduktion och småserier men ger ofta långa transporter och mycket PIA."},
    {q:"Vad är en flödesgrupp (cellayout)?", opts:["En mindre grupp maskiner av olika typ som tillverkar en produktfamilj från början till slut utan att lämna cellen","En linje med bara en maskintyp","Ett lager för färdiga produkter","En avdelning som bara sköter kvalitetskontroll"], correct:0, fb:"Flödesgrupper kombinerar linjetillverkningens korta flöden med den funktionella verkstadens flexibilitet."},

    {q:"Vad står de fem S:en i 5S för?", opts:["Sortera, Systematisera, Städa, Standardisera, Skapa vana","Städa, Stanna, Styra, Se, Support","Sortera, Slänga, Städa, Se, Spara","Systematisera, Sälja, Städa, Standardisera, Stödja"], correct:0, fb:"5S är fem japanska ord som alla börjar med S, översatta till dessa fem steg."},
    {q:"Vad är syftet med S1 – Sortera?", opts:["Att rensa bort det som inte är nödvändigt för det dagliga arbetet","Att märka alla verktyg med etiketter","Att skapa en checklista för underhåll","Att sätta upp en lagtavla"], correct:0, fb:"Sortera handlar om att skilja på det som verkligen behövs och det som inte gör det."},

    {q:"Vad handlar S3 – Städa och rengör om?", opts:["Att allt vid arbetsplatsen ska hållas i bästa möjliga skick och alltid vara redo att användas","Att slänga allt som inte används dagligen","Att skapa en lagtavla för 5S-arbetet","Att sätta upp en riskbedömning för hela fabriken"], correct:0, fb:"Städning omfattar utrustning, verktyg, material och dokument, inte bara golvytor."},

    {q:"Vad innebär S4 – Standardisera?", opts:["Att arbetslaget kommer överens om en standard för hur arbetsplatsen ska fungera och hur den ska hållas i ordning","Att alla nya verktyg köps in centralt","Att man slutar göra förbättringar","Att man byter ut all utrustning mot ny"], correct:0, fb:"Standarden beskriver arbetssätten så att alla vet vad som gäller och kan följa upp avvikelser."},

];

const QUIZ_LENGTH = 30;
let order = [];
let idx = 0;
let answered = false;
let score = 0;
let history = [];

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function shuffleOptions(item){
  const pairs = item.opts.map((o, i) => ({ text: o, wasCorrect: i === item.correct }));
  const shuffled = shuffle(pairs);
  const newOpts = shuffled.map(p => p.text);
  const newCorrect = shuffled.findIndex(p => p.wasCorrect);
  return { ...item, opts: newOpts, correct: newCorrect };
}
function buildOrder(){
  return shuffle(QUESTIONS).slice(0, Math.min(QUIZ_LENGTH, QUESTIONS.length)).map(shuffleOptions);
}
function updateProgress(){
  const fill = document.getElementById('progressFill');
  const label = document.getElementById('progressLabel');
  const pct = order.length ? (idx/order.length)*100 : 0;
  fill.style.width = pct + '%';
  label.textContent = Math.min(idx+1, order.length) + ' / ' + order.length;
}
function startQuiz(){
  order = buildOrder();
  idx = 0; score = 0; history = [];
  document.getElementById('poolNote').textContent = `Frågebank: ${QUESTIONS.length} frågor · ${Math.min(QUIZ_LENGTH, QUESTIONS.length)} slumpas ut denna omgång`;
  renderQuestion();
}
function renderQuestion(){
  answered = false;
  updateProgress();
  const card = document.getElementById('card');
  if(idx >= order.length){ renderResult(); return; }
  const item = order[idx];
  const optHtml = item.opts.map((o,i) => {
    const key = String.fromCharCode(65+i);
    return `<button class="opt" data-i="${i}"><span class="k">${key}</span><span>${o}</span></button>`;
  }).join('');
  card.innerHTML = `
    <div class="qmeta">
      <span class="qtag" style="background:var(--page-dim); color:var(--page-accent);">${CAT_LABEL}</span>
      <span class="qnum">Fråga ${idx+1} av ${order.length}</span>
    </div>
    <div class="prompt">${item.q}</div>
    <div class="options">${optHtml}</div>
    <div class="feedback" id="feedback"></div>
    <div class="controls"><button class="next" id="nextBtn" disabled>Nästa</button></div>
  `;
  card.querySelectorAll('.opt').forEach(btn => {
    btn.addEventListener('click', () => selectAnswer(parseInt(btn.dataset.i)));
  });
  document.getElementById('nextBtn').addEventListener('click', () => { idx++; renderQuestion(); });
}
function selectAnswer(i){
  if(answered) return;
  answered = true;
  const item = order[idx];
  const correct = item.correct;
  document.querySelectorAll('.opt').forEach((btn, bi) => {
    btn.setAttribute('disabled','true');
    if(bi === correct) btn.classList.add('correct');
    if(bi === i && i !== correct) btn.classList.add('wrong');
  });
  const isCorrect = (i === correct);
  if(isCorrect) score++;
  history.push({q:item.q, correct:isCorrect, correctText:item.opts[correct]});
  const fb = document.getElementById('feedback');
  fb.classList.add('show', isCorrect ? 'ok' : 'bad');
  fb.innerHTML = `<b>${isCorrect ? 'Rätt!' : 'Inte riktigt.'}</b>${item.fb}`;
  document.getElementById('nextBtn').disabled = false;
}
function renderResult(){
  const card = document.getElementById('card');
  const pct = order.length ? Math.round((score/order.length)*100) : 0;
  const reviewHtml = history.map(h => `
    <div class="review-item ${h.correct ? 'ok' : 'bad'}">
      <div class="q">${h.q}</div>
      <div class="a">${h.correct ? 'Du svarade rätt.' : 'Rätt svar: ' + h.correctText}</div>
    </div>`).join('');
  card.innerHTML = `
    <div class="result">
      <div class="big" style="color:var(--page-accent);">${score} / ${order.length}</div>
      <div class="of">${pct}% rätt</div>
      <button class="restart" id="restartBtn">Kör igen (nya slumpade frågor)</button>
      <div class="review">${reviewHtml}</div>
    </div>`;
  document.getElementById('restartBtn').addEventListener('click', startQuiz);
  document.getElementById('progressFill').style.width = '100%';
  document.getElementById('progressLabel').textContent = order.length + ' / ' + order.length;
}
startQuiz();
</script>
