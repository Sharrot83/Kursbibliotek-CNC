<script>
const CAT_ID = "underhall";
const CAT_LABEL = "Underhåll & Driftsäkerhet";
const QUESTIONS = [
    {q:"Hur definieras underhåll enligt standarden SS-EN 13306?", opts:["Kombinationen av alla tekniska, organisatoriska och ledningsmässiga åtgärder för att vidmakthålla eller återställa en enhets funktion","Enbart reparation efter haveri","Enbart förebyggande smörjning","Enbart städning av utrustning"], correct:0, fb:"Underhåll definieras som kombinationen av tekniska, organisatoriska och ledningsmässiga åtgärder under en enhets livstid för att vidmakthålla eller återställa dess funktion."},
    {q:"Vilka tre mål har underhåll enligt materialet?", opts:["Personsäkerhet, anläggningssäkerhet, miljösäkerhet","Kvalitet, kostnad, leveranstid","Kaizen, kanban, jidoka","Rengöring, smörjning, inspektion"], correct:0, fb:"De tre målen med underhåll är personsäkerhet, anläggningssäkerhet och miljösäkerhet."},
    {q:"Vad är grundkravet på utrustningen enligt materialet?", opts:["Den ska vara billigast möjligt","Den ska fungera när den ska fungera","Den ska aldrig underhållas","Den ska bytas ut vart femte år"], correct:1, fb:"Grundkravet är att utrustningen ska fungera när den ska fungera, med rätt takt, kvalitet och kostnad."},
    {q:"Vilka tre delar bygger upp en utrustnings driftsäkerhet?", opts:["Funktionssäkerhet, underhållsmässighet, underhållssäkerhet","Kvalitet, kostnad, leveranstid","Tillgänglighet, prestanda, kvalitet (OEE)","Rengöring, smörjning, inspektion"], correct:0, fb:"Driftsäkerheten beror på funktionssäkerhet (pålitlighet), underhållsmässighet (hur lätt den kan underhållas) och underhållssäkerhet (organisation/logistik)."},
    {q:"Vad står MTBF för?", opts:["Mean Time Between Failures, medeltid mellan fel","Maximum Time Before Failure","Mean Total Breakdown Frequency","Minimum Time Between Fixes"], correct:0, fb:"MTBF är medeltiden mellan fel, ett viktigt nyckeltal inom driftsäkerhet."},
    {q:"Vad står MDT för?", opts:["Mean Down Time, medel stopptid","Maximum Delay Time","Mean Delivery Time","Machine Downtime Tracker"], correct:0, fb:"MDT är medel stopptid, den genomsnittliga tiden det är fel på maskinen."},
    {q:"Vad står TAK-faktorn (OEE) för, och hur beräknas den?", opts:["Tillgänglighet × Anläggningsutbyte × Kvalitetsutbyte","Tid × Antal × Kostnad","Transport × Arbete × Kapital","Tillverkning × Analys × Kontroll"], correct:0, fb:"TAK = Tillgänglighet × Anläggningsutbyte × Kvalitetsutbyte, ett mått på hur väl utrustningen utnyttjas."},
    {q:"Hur beräknas faktorn Tillgänglighet (T) i TAK/OEE?", opts:["Tillgänglig tid delat med skifttid","Antal godkända produkter delat med antal producerade","Verklig mängd delat med teoretisk mängd","Reservdelskostnad delat med personalkostnad"], correct:0, fb:"T = tillgänglig tid / skifttid, det vill säga hur stor del av planerad tid maskinen faktiskt kunde köras."},
    {q:"Vad hände i exemplet där ett företag övervägde ett tredje skiftlag för 7 mkr/år?", opts:["En TAK-analys visade att anläggningseffektiviteten bara var 53 %, och investeringen skrotades till förmån för att höja effektiviteten","Skiftlaget infördes direkt utan analys","Maskinerna byggdes om för högre hastighet","Inget agerades och produktionen förblev oförändrad"], correct:0, fb:"En noggrann TAK-analys visade att anläggningseffektiviteten bara var 53 %, vilket ledde till att man i stället satsade på att höja effektiviteten till en bråkdel av investeringskostnaden."},
    {q:"Ungefär hur mycket dyrare kan en ändring vara att göra i drift jämfört med i idéstadiet, enligt materialet?", opts:["Upp till 10 gånger dyrare","Upp till 100 gånger dyrare","Upp till 1000 gånger dyrare","Ingen skillnad"], correct:2, fb:"Erfarenheten visar att en ändring i drift kan vara upp till 1000 gånger dyrare än på idéstadiet."},
    {q:"Vad visar 'badkarskurvan' inom underhåll?", opts:["Kostnader höga vid idrifttagning, låga/stabila under drift, stigande vid utslitning","Att kostnaderna alltid är konstanta","Att underhållskostnader alltid minskar över tid","Endast personalkostnader"], correct:0, fb:"Badkarskurvan visar att kostnaderna är höga vid idrifttagning, låga och stabila under drift, och stiger igen vid utslitning."},
    {q:"Vad står LCC för och vad används begreppet till?", opts:["Life Cycle Cost — jämföra produktalternativ utifrån total kostnad under hela livslängden","Load Capacity Control — mäta lastkapacitet","Local Cost Calculation — beräkna lokala kostnader","Lean Cycle Coordination — samordna produktion"], correct:0, fb:"LCC (Life Cycle Cost) används för att jämföra olika produktalternativ utifrån den totala kostnaden under hela livslängden."},
    {q:"Vad är skillnaden mellan avhjälpande underhåll (AU) och förebyggande underhåll (FU)?", opts:["AU sker efter att ett fel upptäckts, FU sker vid förutbestämda intervall för att minska felrisk","AU och FU är samma sak","FU sker bara efter haveri","AU görs enbart av tillverkaren"], correct:0, fb:"Avhjälpande underhåll (AU) genomförs efter att ett fel redan upptäckts, medan förebyggande underhåll (FU) görs vid bestämda intervall för att minska felsannolikheten."},
    {q:"Vad kallas underhållsåtgärder som syftar till att hitta orsaker till fel så de aldrig uppkommer igen?", opts:["Förbättrande underhåll","Akutunderhåll","Uppskjutet underhåll","Konstruktivt underhåll"], correct:0, fb:"Förbättrande underhåll syftar till att hitta orsaker till fel och se till att felen aldrig uppkommer igen."},
    {q:"Enligt materialet, hur mycket längre tid tar ett oplanerat (akut) arbete jämfört med ett planerat?", opts:["Ungefär hälften så lång tid","Minst dubbelt så lång tid","Exakt lika lång tid","Tio gånger så lång tid"], correct:1, fb:"Ett oplanerat, akut arbete tar minst dubbelt så lång tid att utföra som ett planerat arbete."},
    {q:"Ungefär hur stor andel av alla fel 'växer' från småfel till akutfel om inget görs?", opts:["Cirka 10 %","Cirka 30 %","Cirka 70 %","Cirka 99 %"], correct:2, fb:"Cirka 70 % av alla fel växer och förvärras till akutfel om de inte åtgärdas i tid."},
    {q:"I räkneexemplet med lagerhaveriet, hur mycket sparade man genom att åtgärda kopplingsslitaget i tid i stället för att göra en akutreparation?", opts:["Ingenting, kostnaden blev densamma","Cirka 48 900 kr", "Cirka 500 kr","Cirka 2 000 kr"], correct:1, fb:"Den akuta reparationen kostade 65 200 kr, medan en planerad åtgärd i tid hade kostat 16 300 kr — en besparing på 48 900 kr."},
    {q:"Vad kännetecknar ett 'underhållsfönster'?", opts:["Ett naturligt produktionsstopp (t.ex. verktygsbyte) där planerat underhåll kan utföras utan extra produktionsbortfall","Ett fönster som ska hållas rent enligt 5S","Ett datorprogram för underhållsplanering","Ett dokument som beskriver haverier"], correct:0, fb:"Underhållsfönster är naturliga stopp i produktionen, till exempel verktygsbyten, som kan utnyttjas för planerat underhåll."},
    {q:"Vilken är den viktigaste och mest lönsamma FU-åtgärden av de fyra huvudaktiviteterna?", opts:["Rengöring","Smörjning","Inspektioner","Förutbestämda utbyten"], correct:0, fb:"Rengöring lyfts fram som den viktigaste och mest lönsamma förebyggande underhållsåtgärden."},
    {q:"Vad är skillnaden mellan direkt och indirekt förebyggande underhåll?", opts:["Direkt FU förhindrar att fel uppstår (t.ex. rengöring, smörjning), indirekt FU ger effekt när ett upptäckt fel avhjälps (t.ex. inspektioner)","Direkt FU utförs bara av underhållspersonal, indirekt av operatörer","Det är samma sak med olika namn","Indirekt FU sker bara vid haveri"], correct:0, fb:"Direkt förebyggande underhåll (rengöring, smörjning) förhindrar att fel uppstår, medan indirekt FU (inspektioner, kontroller) ger effekt först när ett upptäckt fel avhjälps."},
    {q:"Vad kallas läran om slitage och smörjning?", opts:["Tribologi","Metrologi","Reologi","Ergonomi"], correct:0, fb:"Tribologi är läran om slitage, nötning och smörjning."},
    {q:"Vid vilken temperatur mäts oljans viskositet enligt standard?", opts:["0 °C","20 °C","40 °C","100 °C"], correct:2, fb:"Standardtemperaturen för viskositetsmätning är 40 °C, enligt ISO 3448 (ISO VG)."},
    {q:"Vad beskriver NLGI-talet?", opts:["Smörjfettets konsistens","Oljans viskositet","Antalet partiklar i oljan","Lagrets livslängd"], correct:0, fb:"NLGI-talet beskriver smörjfettets konsistens, på en skala från 000 (flytande) till 6 (blockfett)."},
    {q:"Vilken typ av slitage är vanligast i rullningslager och kuggväxlar?", opts:["Abrasion","Erosion","Utmattning/gropbildning (pitting)","Korrosion"], correct:2, fb:"Utmattning eller gropbildning (pitting) är den vanligaste typen av slitage i rullningslager och kuggväxlar."},
    {q:"Vilken slitagetyp är särskilt vanlig i hydraulsystem och beror på att partiklar 'blästrar' metallytan?", opts:["Erosion","Adhesion","Korrosion","Utmattning"], correct:0, fb:"Erosion uppstår ofta i hydraulsystem när partiklar i oljan bombarderar metallytan i rörkrökar och ventiler."},
    {q:"Hur mycket vatten i smörjmedlet kan enligt SKF:s provningar halvera livslängden på ett rullningslager?", opts:["0,01 %","1 %","10 %","50 %"], correct:0, fb:"Redan 0,01 % vatten i smörjmedlet kan halvera livslängden på ett rullningslager, enligt SKF:s provningar."},
    {q:"Vad innebär smörjfilmsfaktorn lambda (λ) > 3?", opts:["Fullfilm, låg risk för skada","Blandfilm, medelrisk","Gränsskikt, hög risk","Ingen smörjning alls"], correct:0, fb:"λ > 3 innebär fullfilmssmörjning och låg risk, medan λ mellan 1–3 är blandfilm (medelrisk) och λ < 1 gränsskikt (hög risk)."},
    {q:"Ungefär hur stor andel av ett smörjfett utgörs vanligen av basolja?", opts:["5–25 %","25–50 %","75–95 %","100 %"], correct:2, fb:"Ett fett består oftast av 75–95 % basolja, 5–25 % förtjockningsmedel och 1–5 % additiv."},
    {q:"Vilket ämne används oftast som förtjockningsmedel i moderna smörjfetter?", opts:["Litium/litiumkomplex","Salt","Vax","Grafit"], correct:0, fb:"De vanligaste förtjockningsmedlen idag är litium och litiumkomplex."},
    {q:"Vilka fyra analyser bör man främst utföra vid en oljeanalys?", opts:["Viskositet, vatteninnehåll, partikelinnehåll och TAN-tal/syratal","Färg, doft, temperatur och pris","Volym, densitet, ljud och ljus","Smak, konsistens, ålder och märke"], correct:0, fb:"De fyra huvudanalyserna är viskositet, vatteninnehåll, partikelinnehåll och TAN-talet (syratalet)."},
    {q:"Hur högt bör vatteninnehållet i oljan högst vara enligt materialet?", opts:["Cirka 0,05 % (500 ppm)","Cirka 5 %","Cirka 50 %","Det finns ingen gräns"], correct:0, fb:"Vatteninnehållet i oljan bör inte tillåtas överstiga 0,05 % (500 ppm)."},
    {q:"Vad innebär ett TAN-tal (syratal) på 0?", opts:["Oljan/fettet är neutralt (inte oxiderat)","Oljan är helt förbrukad","Oljan innehåller mycket vatten","Oljan är extremt trögflytande"], correct:0, fb:"Ett TAN-tal på 0 betyder att produkten är neutral. TAN-talet stiger när oljan åldras och oxiderar."},
    {q:"Vilken metod för inspektion kan upptäcka mer än 65 % av alla fel men ger kortare förvarningstid?", opts:["Subjektiv kontroll (se, lyssna, känna, lukta, smaka)","Objektiv tillståndskontroll","Kontinuerlig övervakning","Ingen av dessa"], correct:0, fb:"Subjektiv kontroll med de fem sinnena kan upptäcka mer än 65 % av alla fel, men ger kortare förvarningstid än instrumentbaserade metoder."},
    {q:"Vilken tillståndskontrollmetod ger normalt längst förvarningstid innan ett haveri?", opts:["Subjektiv kontroll","Objektiv tillståndskontroll med periodvisa mätningar","Kontinuerlig övervakning med fasta givare","Ingen skillnad mellan metoderna"], correct:2, fb:"Kontinuerlig övervakning med fasta givare kopplade till ett datorsystem ger normalt den längsta förvarningstiden."},
    {q:"Vilken underhållsstrategi ger enligt materialet lägst totala kostnader för befintliga maskiner?", opts:["Underhåll vid behov (akut)","Underhåll vid fasta, planerade stopp","Tillståndsbaserat underhåll","Ingen strategi alls"], correct:2, fb:"Tillståndsbaserat underhåll ger lägre kostnader för underhåll och produktionsbortfall än både akut underhåll och fasta planerade stopp."},
    {q:"Vad krävs för att uppnå full kontroll i en sammanbyggd produktionslinje utan mellanlager?", opts:["Att man i varje ögonblick vet tillståndet i varje enskild komponent i varje maskin","Att man aldrig utför inspektioner","Att en enda maskin ansvarar för hela linjens tillgänglighet","Att linjen aldrig stoppas"], correct:0, fb:"Full kontroll innebär att man i varje ögonblick måste veta tillståndet i de enskilda komponenterna i varje maskin, särskilt i en linje utan mellanlager."},
    {q:"Vad hände med tillgängligheten i exemplet där ett mellanlager ersattes med en robot?", opts:["Tillgängligheten steg till 95 %","Systemet blev störningskänsligt och total tillgänglighet sjönk från 85 % till 68,6 %","Ingen förändring skedde","Tillgängligheten blev exakt densamma som tidigare"], correct:1, fb:"När mellanlagret togs bort blev linjen störningskänslig och tillgängligheten sjönk från 85 % till 0,85 × 0,95 × 0,85 = 68,6 %."},
    {q:"Hur länge bör en 5S-adresslapp som markerar en plats för åtgärd som mest sitta uppe?", opts:["30 dagar","1 dag","1 år","Det finns ingen tidsgräns"], correct:0, fb:"5S-adresslappar bör inte sitta uppe längre än 30 dagar och tas bara bort när åtgärden är genomförd."},
    {q:"Vilket japanskt S-steg innebär att skapa en given och markerad plats för verktyg och hjälpmedel?", opts:["Seiri","Seiton","Seiso","Seiketsu"], correct:1, fb:"Seiton (systematisera) innebär att de verktyg och hjälpmedel som blir kvar får en given och markerad plats."},
    {q:"Vilket 5S-steg handlar om initialrengöring av maskin och arbetsytor?", opts:["Seiri","Seiton","Seiso","Shitsuke"], correct:2, fb:"Seiso (städa/initialrengöring) innebär att hela maskinen, kringutrustning och arbetsytor rengörs."},
    {q:"Vilket 5S-steg säkerställer att åtgärderna genomförs genom regelbundna revisioner?", opts:["Seiri","Seiketsu","Shitsuke","Seiton"], correct:2, fb:"Shitsuke (standardisera/disciplin) innebär att revisioner genomförs med regelbundna intervaller för att kontrollera standarden."},
    {q:"Vilka tre 'ben' står TPM-arbetet på enligt materialet?", opts:["Mätetal (TAK/OEE), 5S och operatörsunderhåll/förbättringsarbete","Budget, kalkyl och uppföljning","Sortera, systematisera och städa","Rengöring, smörjning och byte"], correct:0, fb:"TPM-arbetet vilar på tre ben: mätetal som TAK/OEE, 5S, samt operatörsunderhåll och förbättringsarbete."},
    {q:"Vad orsakade kvarvarande störningar trots framgångsrikt TPM-arbete, enligt materialet?", opts:["Revirtänkande mellan produktion och underhåll","För mycket rengöring","För höga TAK-tal","Brist på reservdelar"], correct:0, fb:"Revirtänkande mellan produktions- och underhållspersonal ledde till kvarvarande störningar, vilket löstes med förbättringsgrupper."},
    {q:"Vilket tredje 'M' fick TPM utöver Maintenance och Manufacturing?", opts:["Management","Motivation","Measurement","Modification"], correct:0, fb:"TPM fick ett tredje M för Management, eftersom arbetssättet även omfattar lednings- och produktionsfrågor."},
    {q:"Vad kan ett systematiskt och väl genomfört operatörsunderhåll minska de akuta felen med, enligt materialet?", opts:["Med upp till 10 %","Med upp till 75 %","Ingen minskning alls","Med exakt 50 %"], correct:1, fb:"Ett väl genomfört operatörsunderhåll kan minska de akuta felen med upp till 75 %."},
    {q:"Hur delas underhållsarbeten in efter svårighetsgrad i operatörsunderhållet?", opts:["1 enkla (gröna), 2 medelsvåra (blåa), 3 kräver specialkunskaper (röda)","A, B och C utan särskild betydelse","Bara två nivåer: lätt och svårt","Efter vilken veckodag arbetet utförs"], correct:0, fb:"UH-arbeten delas in i tre svårighetsgrader: 1 (enkla/gröna), 2 (medelsvåra/blåa) och 3 (kräver specialkunskaper/röda)."},
    {q:"Ungefär hur stor andel av underhållets tidsmässiga kapacitet frigörs i praktiken genom operatörsunderhåll, trots att 60 % av arbetena räknat i antal är enkla?", opts:["Cirka 20 %","Cirka 60 %","Cirka 90 %","Ingen alls"], correct:0, fb:"Även om 60 % av arbetena (i antal) är enkla frigör det bara cirka 20 % av underhållets tidsmässiga kapacitet, eftersom de enkla jobben ofta också är snabbast."},
    {q:"Vilka två kategorier delas underhållskostnader vanligen in i, utöver kostnaden för förlorad produktion?", opts:["Direkta och indirekta underhållskostnader","Fasta och rörliga löner","Interna och externa fakturor","Kortsiktiga och långsiktiga investeringar"], correct:0, fb:"Underhållskostnader delas in i direkta underhållskostnader (personal, reservdelar, verkstäder) och indirekta underhållskostnader (övertid, förseningar, kvalitetsbrister med mera)."},
];

const QUIZ_LENGTH = 30;
let order = [];
let idx = 0;
let answered = false;
let score = 0;
let history = [];

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function shuffleOptions(item){
  const pairs = item.opts.map((o, i) => ({ text: o, wasCorrect: i === item.correct }));
  const shuffled = shuffle(pairs);
  const newOpts = shuffled.map(p => p.text);
  const newCorrect = shuffled.findIndex(p => p.wasCorrect);
  return { ...item, opts: newOpts, correct: newCorrect };
}
function buildOrder(){
  return shuffle(QUESTIONS).slice(0, Math.min(QUIZ_LENGTH, QUESTIONS.length)).map(shuffleOptions);
}
function updateProgress(){
  const fill = document.getElementById('progressFill');
  const label = document.getElementById('progressLabel');
  const pct = order.length ? (idx/order.length)*100 : 0;
  fill.style.width = pct + '%';
  label.textContent = Math.min(idx+1, order.length) + ' / ' + order.length;
}
function startQuiz(){
  order = buildOrder();
  idx = 0; score = 0; history = [];
  document.getElementById('poolNote').textContent = `Frågebank: ${QUESTIONS.length} frågor · ${Math.min(QUIZ_LENGTH, QUESTIONS.length)} slumpas ut denna omgång`;
  renderQuestion();
}
function renderQuestion(){
  answered = false;
  updateProgress();
  const card = document.getElementById('card');
  if(idx >= order.length){ renderResult(); return; }
  const item = order[idx];
  const optHtml = item.opts.map((o,i) => {
    const key = String.fromCharCode(65+i);
    return `<button class="opt" data-i="${i}"><span class="k">${key}</span><span>${o}</span></button>`;
  }).join('');
  card.innerHTML = `
    <div class="qmeta">
      <span class="qtag" style="background:var(--page-dim); color:var(--page-accent);">${CAT_LABEL}</span>
      <span class="qnum">Fråga ${idx+1} av ${order.length}</span>
    </div>
    <div class="prompt">${item.q}</div>
    <div class="options">${optHtml}</div>
    <div class="feedback" id="feedback"></div>
    <div class="controls"><button class="next" id="nextBtn" disabled>Nästa</button></div>
  `;
  card.querySelectorAll('.opt').forEach(btn => {
    btn.addEventListener('click', () => selectAnswer(parseInt(btn.dataset.i)));
  });
  document.getElementById('nextBtn').addEventListener('click', () => { idx++; renderQuestion(); });
}
function selectAnswer(i){
  if(answered) return;
  answered = true;
  const item = order[idx];
  const correct = item.correct;
  document.querySelectorAll('.opt').forEach((btn, bi) => {
    btn.setAttribute('disabled','true');
    if(bi === correct) btn.classList.add('correct');
    if(bi === i && i !== correct) btn.classList.add('wrong');
  });
  const isCorrect = (i === correct);
  if(isCorrect) score++;
  history.push({q:item.q, correct:isCorrect, correctText:item.opts[correct]});
  const fb = document.getElementById('feedback');
  fb.classList.add('show', isCorrect ? 'ok' : 'bad');
  fb.innerHTML = `<b>${isCorrect ? 'Rätt!' : 'Inte riktigt.'}</b>${item.fb}`;
  document.getElementById('nextBtn').disabled = false;
}
function renderResult(){
  const card = document.getElementById('card');
  const pct = order.length ? Math.round((score/order.length)*100) : 0;
  const reviewHtml = history.map(h => `
    <div class="review-item ${h.correct ? 'ok' : 'bad'}">
      <div class="q">${h.q}</div>
      <div class="a">${h.correct ? 'Du svarade rätt.' : 'Rätt svar: ' + h.correctText}</div>
    </div>`).join('');
  card.innerHTML = `
    <div class="result">
      <div class="big" style="color:var(--page-accent);">${score} / ${order.length}</div>
      <div class="of">${pct}% rätt</div>
      <button class="restart" id="restartBtn">Kör igen (nya slumpade frågor)</button>
      <div class="review">${reviewHtml}</div>
    </div>`;
  document.getElementById('restartBtn').addEventListener('click', startQuiz);
  document.getElementById('progressFill').style.width = '100%';
  document.getElementById('progressLabel').textContent = order.length + ' / ' + order.length;
}
startQuiz();
</script>
