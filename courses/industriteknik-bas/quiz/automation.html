<meta charset="UTF-8">

<title>Automation & IT-kunskap — Quiz | Industriteknik BAS</title>
<style>
  :root{

    --bg2: #0c1116;

    --cyan: #6fc3d6;
    --green: #4fa571;
    --green-dim: #1f3d2b;
    --red: #e0584f;
    --red-dim: #3d2320;
    --blue: #5b9bd5;
    --blue-dim: #1c3245;
    --purple: #a487d6;
    --purple-dim: #2c2440;
    --teal: #4fb3a5;
    --teal-dim: #1c3d38;
    --pink: #d97aa0;
    --pink-dim: #3a2230;
  }
  :root[data-theme="light"]{
    --bg: #eef0f2;
    --bg2: #e4e7ea;
    --panel: #ffffff;
    --panel-2: #f1f3f5;
    --line: #d7dbe0;
    --line-soft: #e6e9ec;
    --text: #1b2127;
    --muted: #5c6670;
    --amber: #c96a12;
    --amber-dim: #fdead2;
    --cyan: #3f97ab;
    --green: #2f8a52;
    --green-dim: #e1f3e7;
    --red: #c2453c;
    --red-dim: #fbe4e2;
    --blue: #3f7ab8;
    --blue-dim: #e3edf7;
    --purple: #7d5cb8;
    --purple-dim: #ece6f7;
    --teal: #2f8f81;
    --teal-dim: #e0f3f0;

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

    color: var(--text);
    min-height:100vh;
  }
  [data-theme="light"] body{
    background:

      linear-gradient(90deg, var(--line-soft) 1px, transparent 1px) 0 0/34px 100%,
      radial-gradient(1200px 500px at 12% -10%, #dce6f0 0%, transparent 55%),
      radial-gradient(900px 500px at 110% 10%, #f5e6d8 0%, transparent 55%),
      var(--bg);
    background-attachment: fixed;
  }

  a{color:inherit;}
  ::selection{background:var(--amber); color:#1a1105;}

  .wrap{max-width:960px; margin:0 auto; padding:0 20px 90px;}
  .wrap.narrow{max-width:780px;}

  /* --- top nav --- */
  .topnav{
    max-width:960px; margin:0 auto; padding:18px 20px 0;
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    font-size:12.5px; letter-spacing:.04em;
  }
  .topnav .brand{
    display:flex; align-items:center; gap:9px; text-decoration:none; color:var(--text);
    font-family:"Arial Narrow", Arial, sans-serif; font-weight:800; letter-spacing:.02em; font-size:15px;
  }
  .topnav .brand .mark{
    width:20px; height:20px; border:2px solid var(--amber); position:relative; flex:0 0 auto;
  }
  .topnav .brand .mark::before, .topnav .brand .mark::after{
    content:""; position:absolute; background:var(--amber);
  }
  .topnav .brand .mark::before{ left:50%; top:2px; bottom:2px; width:2px; transform:translateX(-50%); }
  .topnav .brand .mark::after{ top:50%; left:2px; right:2px; height:2px; transform:translateY(-50%); }
  .topnav nav{display:flex; gap:18px;}
  .topnav nav a{text-decoration:none; color:var(--muted); font-weight:600; transition:.15s;}
  .topnav nav a:hover{color:var(--amber);}

  /* --- dimension-line divider (signature element) --- */
  .dim{
    display:flex; align-items:center; gap:10px; margin:38px 0 26px; color:var(--muted);
    font-family:"IBM Plex Mono","SFMono-Regular",Consolas,monospace; font-size:11.5px;
    letter-spacing:.08em; text-transform:uppercase; white-space:nowrap;
  }
  .dim::before, .dim::after{ content:""; flex:1; height:1px; background:var(--line);
    background-image: linear-gradient(90deg, var(--line) 0, var(--line) 100%);
    position:relative;
  }
  .dim .tick{position:relative;}
  .dim-line{flex:1; height:1px; background:var(--line); position:relative;}
  .dim-line::before{content:"";position:absolute; left:0; top:-4px; width:1px; height:9px; background:var(--line);}
  .dim-line::after{content:"";position:absolute; right:0; top:-4px; width:1px; height:9px; background:var(--line);}

  header.hero{padding:34px 0 6px;}
  .eyebrow{
    font-family:"IBM Plex Mono", Consolas, monospace;
    letter-spacing:.18em; text-transform:uppercase; font-size:11.5px;
    color:var(--amber); font-weight:600; display:flex; align-items:center; gap:8px;
  }
  .eyebrow::before{content:"";width:18px;height:2px;background:var(--amber);display:inline-block;}
  h1{

  .sub{color:var(--muted); font-size:15.5px; max-width:62ch; line-height:1.6;}

  /* --- subject grid / title-block cards --- */
  .grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(270px,1fr)); gap:16px; margin-top:30px;}
  .tblock{
    border:1px solid var(--line); border-radius:4px; background:var(--panel);

    transition:.18s; text-decoration:none; color:var(--text);

  .tblock::before{ /* corner registration marks */
    content:""; position:absolute; top:8px; left:8px; width:9px; height:9px;
    border-top:1.5px solid var(--accent,var(--amber)); border-left:1.5px solid var(--accent,var(--amber));

  }
  .tblock::after{
    content:""; position:absolute; bottom:8px; right:8px; width:9px; height:9px;

    display:flex; justify-content:space-between; align-items:center;

  .tblock .tb-top .code{color:var(--accent,var(--amber)); font-weight:700;}
  .tblock .tb-body{padding:16px 18px 6px; flex:1;}
  .tblock h3{margin:0 0 8px; font-family:"Arial Narrow",Arial,sans-serif; font-size:21px; font-weight:800; letter-spacing:-.01em;}
  .tblock p{margin:0; color:var(--muted); font-size:13.6px; line-height:1.55;}
  .tblock .tb-bottom{
    display:flex; justify-content:space-between; align-items:center; gap:8px;
    padding:13px 18px; margin-top:14px; border-top:1px solid var(--line);
    font-family:"IBM Plex Mono",Consolas,monospace; font-size:11px; color:var(--muted);
  }
  .tblock .tb-bottom .qn{color:var(--accent,var(--amber)); font-weight:700;}
  .pillrow{display:flex; gap:8px; padding:0 18px 16px;}
  .pill{
    flex:1; text-align:center; padding:9px 6px; border-radius:5px; border:1px solid var(--line);
    font-size:12.5px; font-weight:700; text-decoration:none; color:var(--text); transition:.15s;
    background:var(--panel-2);
  }
  .pill:hover{border-color:var(--accent,var(--amber)); color:var(--accent,var(--amber));}
  .pill.solid{background:var(--accent,var(--amber)); border-color:var(--accent,var(--amber)); color:#0f1115;}
  .pill.solid:hover{filter:brightness(1.08); color:#0f1115;}

  /* --- master card (combined quiz) --- */
  .master{
    margin-top:34px; border:1px solid var(--line); border-radius:6px;
    background:linear-gradient(135deg, #1c232b, #171e25);
    padding:26px 26px 22px; position:relative; overflow:hidden;
  }
  .master::before{
    content:""; position:absolute; inset:0; opacity:.5; pointer-events:none;
    background-image: repeating-linear-gradient(135deg, rgba(255,138,43,.05) 0 2px, transparent 2px 14px);

  .master .mtitle{font-family:"Arial Narrow",Arial,sans-serif; font-weight:800; font-size:23px; margin:2px 0 6px;}
  .master p{color:var(--muted); font-size:14px; max-width:56ch; line-height:1.6; margin:0 0 16px;}

  /* --- buttons --- */
  .btn{
    display:inline-flex; align-items:center; gap:8px; text-decoration:none;
    padding:11px 20px; border-radius:7px; font-weight:700; font-size:14px; border:1px solid transparent;

  }
  .btn-amber{background:var(--amber); color:#1a1105;}
  .btn-amber:hover{filter:brightness(1.08);}
  .btn-ghost{border-color:var(--line); color:var(--text);}
  .btn-ghost:hover{border-color:var(--amber); color:var(--amber);}

  /* --- reading material page --- */
  article.reading h2{
    font-family:"Arial Narrow",Arial,sans-serif; font-size:24px; font-weight:800; letter-spacing:-.005em;
    margin:36px 0 12px; padding-top:4px; color:var(--text);
  }
  article.reading h2 .num{color:var(--accent,var(--amber)); margin-right:8px; font-family:"IBM Plex Mono",monospace; font-size:16px;}
  article.reading h3{
    font-size:16.5px; font-weight:700; margin:22px 0 8px; color:var(--accent,var(--amber));
  }
  article.reading p{color:#c9d2d9; font-size:15px; line-height:1.72; margin:0 0 14px;}
  article.reading ul{margin:0 0 16px; padding-left:0; list-style:none;}
  article.reading ul li{
    position:relative; padding-left:20px; margin-bottom:8px; color:#c9d2d9; font-size:14.6px; line-height:1.6;
  }
  article.reading ul li::before{
    content:""; position:absolute; left:0; top:9px; width:7px; height:2px; background:var(--accent,var(--amber));
  }
  article.reading strong{color:var(--text);}
  .callout{
    border-left:3px solid var(--accent,var(--amber)); background:var(--panel);
    padding:13px 16px; margin:18px 0; border-radius:0 6px 6px 0; font-size:14.2px; color:#dfe6ea; line-height:1.6;
  }
  .callout b{display:block; font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--accent,var(--amber)); margin-bottom:4px; font-family:"IBM Plex Mono",monospace;}
  .lawbox{
    margin:20px 0; padding:16px 18px; border:1px dashed var(--line); border-radius:6px;
    font-style:italic; color:var(--text); font-size:15px; background:var(--bg2);
  }
  .lawbox b{font-style:normal; display:block; font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin-bottom:6px; font-family:"IBM Plex Mono",monospace;}
  .toc{
    display:flex; flex-wrap:wrap; gap:8px; margin:22px 0 6px;
  }
  .toc a{
    font-size:12.5px; padding:6px 11px; border:1px solid var(--line); border-radius:999px;
    text-decoration:none; color:var(--muted); font-weight:600; transition:.15s;
  }
  .toc a:hover{border-color:var(--accent,var(--amber)); color:var(--accent,var(--amber));}

  .footcta{
    margin-top:48px; border-top:1px solid var(--line); padding-top:26px;
    display:flex; justify-content:space-between; align-items:center; gap:14px; flex-wrap:wrap;
  }
  .footcta .ft-txt{font-size:13.5px; color:var(--muted); max-width:44ch;}

  footer.sitefoot{text-align:center; color:var(--muted); font-size:12px; margin-top:50px; padding-bottom:10px;}

  @media (max-width:640px){
    .topnav nav{gap:12px; font-size:12px;}
    .master{padding:20px;}

  /* --- shared topbar / crumbs (site-wide course switcher) --- */
  .topbar{position:sticky; top:0; z-index:999; background:rgba(16,21,27,.92); backdrop-filter:blur(6px); border-bottom:1px solid var(--line);}
  .topbar-inner{max-width:960px; margin:0 auto; padding:12px 20px; display:flex; align-items:center; gap:14px; flex-wrap:wrap;}
  .topbar .brand{font-family:"Arial Narrow", Arial, sans-serif; font-weight:800; letter-spacing:-.01em; font-size:16px; display:flex; align-items:center; gap:8px; white-space:nowrap; text-decoration:none; color:var(--text);}
  .topbar .brand::before{content:"";width:10px;height:10px;background:var(--amber);border-radius:2px;display:inline-block;}
  .course-select{margin-left:auto; background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:8px 12px; font-size:13.5px; font-weight:600; font-family:inherit; cursor:pointer; min-width:190px;}
</style>

<style>
  .progress-row{display:flex; align-items:center; gap:10px; margin:24px 0 20px;}
  .progress-track{flex:1; height:6px; background:var(--panel-2); border-radius:999px; overflow:hidden;}
  .progress-fill{height:100%; background:linear-gradient(90deg, var(--page-accent), var(--green)); width:0%; transition:width .25s;}
  .progress-label{font-size:12.5px; color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap; font-family:"IBM Plex Mono",monospace;}
  .card{
    background: linear-gradient(180deg, var(--panel), var(--panel-2));
    border:1px solid var(--line); border-radius:14px; padding:26px 24px;
    box-shadow: 0 20px 40px -25px rgba(0,0,0,.6);
  }
  .qmeta{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; flex-wrap:wrap; gap:8px;}
  .qtag{font-size:11.5px; text-transform:uppercase; letter-spacing:.08em; font-weight:700; padding:4px 9px; border-radius:6px;}
  .qnum{color:var(--muted); font-size:13px; font-family:"IBM Plex Mono",monospace;}
  .prompt{font-size:18.5px; font-weight:600; line-height:1.4; margin-bottom:18px;}
  .options{display:flex; flex-direction:column; gap:10px;}
  .opt{
    text-align:left; padding:13px 15px; border-radius:10px; border:1px solid var(--line);
    background:#161d24; color:var(--text); font-size:15px; cursor:pointer; transition:.12s;
    display:flex; gap:10px; align-items:flex-start; width:100%;
  }
  .opt:hover:not([disabled]){border-color:var(--page-accent); background:#1a222b;}
  .opt .k{
    flex:0 0 auto; width:22px; height:22px; border-radius:6px; border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-size:12px; color:var(--muted); font-weight:700;
  }
  .opt[disabled]{cursor:default;}
  .opt.correct{border-color:var(--green); background:var(--green-dim);}
  .opt.correct .k{border-color:var(--green); color:var(--green); background:#122a1a;}
  .opt.wrong{border-color:var(--red); background:var(--red-dim);}
  .opt.wrong .k{border-color:var(--red); color:var(--red); background:#2a1513;}
  .feedback{margin-top:16px; padding:14px 16px; border-radius:10px; font-size:14.5px; line-height:1.5; display:none;}
  .feedback.show{display:block;}
  .feedback.ok{background:var(--green-dim); border:1px solid #2f6b47; color:#cdeed9;}
  .feedback.bad{background:var(--red-dim); border:1px solid #7a3833; color:#f3d2ce;}
  .feedback b{display:block; margin-bottom:3px; font-size:13px; text-transform:uppercase; letter-spacing:.06em;}
  .controls{display:flex; justify-content:flex-end; margin-top:20px;}
  button.next{
    background:var(--page-accent); color:#12161b; border:none; padding:11px 22px;
    border-radius:9px; font-weight:700; font-size:14.5px; cursor:pointer;
  }
  button.next:disabled{background:var(--panel-2); color:var(--muted); cursor:not-allowed;}
  button.next:hover:not(:disabled){filter:brightness(1.08);}
  .result{text-align:center; padding:20px 10px 10px;}
  .result .big{font-family:"Arial Narrow", Arial, sans-serif; font-weight:800; font-size:56px; line-height:1;}
  .result .of{color:var(--muted); font-size:15px; margin-top:6px;}
  .review{margin-top:26px; text-align:left; display:flex; flex-direction:column; gap:10px;}
  .review-item{border:1px solid var(--line); border-radius:10px; padding:12px 14px; font-size:14px;}
  .review-item.ok{border-left:3px solid var(--green);}
  .review-item.bad{border-left:3px solid var(--red);}
  .review-item .q{font-weight:600; margin-bottom:4px;}
  .review-item .a{color:var(--muted);}
  .restart{
    margin-top:24px; background:none; border:1px solid var(--line); color:var(--text);
    padding:10px 20px; border-radius:9px; cursor:pointer; font-size:14px; font-weight:600;
  }
  .restart:hover{border-color:var(--page-accent); color:var(--page-accent);}
  .pool-note{margin-top:10px; font-size:13px; color:var(--page-accent); font-weight:600;
    background:var(--page-dim); display:inline-block; padding:5px 12px; border-radius:8px;
    font-family:"IBM Plex Mono",monospace;}
</style>

  :root[data-theme="light"]{
    --page-accent: #3f7ab8;
  }</style>

<script>
const CAT_ID = "automation";
const CAT_LABEL = "Automation & IT-kunskap";
const QUESTIONS = [
    {q:"Vad är huvudsyftet med industriell automation?", opts:["Att göra produktionen snabbare, säkrare och mer exakt genom att minska manuell inblandning", "Att helt ta bort behovet av produkter", "Att öka antalet manuella arbetsmoment", "Att göra processer långsammare men billigare"], correct:0, fb:"Automation syftar till att göra produktionen snabbare, säkrare och mer exakt genom att minska den manuella inblandningen."},
    {q:"Vilken uppgift har sensorer och givare i ett automationssystem?", opts:["Mäter t.ex. temperatur, tryck, flöde och position i realtid", "Fattar alla beslut i systemet", "Utför tunga och farliga arbetsmoment", "Visar information för operatören"], correct:0, fb:"Sensorer och givare mäter fysikaliska storheter som temperatur, tryck, flöde och position i realtid."},
    {q:"Vad gör en PLC i ett automationssystem?", opts:["Tar emot mätdata och fattar beslut om vad som ska hända", "Mäter temperatur direkt i processen", "Utför tunga eller farliga uppgifter fysiskt", "Visar grafer för operatören"], correct:0, fb:"PLC:n (styrenheten) tar emot mätdata från sensorer och fattar beslut om vilka åtgärder som ska vidtas."},
    {q:"Vad står HMI för och vilken funktion har det?", opts:["Människa-Maskin-Gränssnitt — skärmar där operatörer övervakar och justerar processen", "Ett nätverksprotokoll för sensorer", "En typ av robot", "En elektrisk komponent i PLC:n"], correct:0, fb:"HMI (Människa-Maskin-Gränssnitt) är skärmar och kontrollpaneler där operatörer övervakar processen och gör justeringar."},
    {q:"Vilken fördel med automation nämns specifikt kopplad till arbetsmiljö?", opts:["Säkrare arbetsmiljö eftersom människor slipper de farligaste momenten", "Fler manuella arbetsuppgifter", "Högre ljudnivå i fabriken", "Mindre flexibilitet i produktionen"], correct:0, fb:"En fördel med automation är säkrare arbetsmiljö, eftersom människor slipper de farligaste arbetsmomenten."},
    {q:"Vad är ett styrsystem enligt materialet?", opts:["Den tekniska lösning som övervakar och reglerar en process så att den ger önskat resultat", "Ett dokument som beskriver produktens kvalitet", "En robot som utför farliga uppgifter", "Ett nätverk för dataöverföring"], correct:0, fb:"Ett styrsystem är den tekniska lösningen som övervakar och reglerar en process så att den ger önskat resultat."},

const QUIZ_LENGTH = 30;
let order = [];
let idx = 0;
let answered = false;
let score = 0;
let history = [];

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function shuffleOptions(item){
  const pairs = item.opts.map((o, i) => ({ text: o, wasCorrect: i === item.correct }));
  const shuffled = shuffle(pairs);
  const newOpts = shuffled.map(p => p.text);
  const newCorrect = shuffled.findIndex(p => p.wasCorrect);
  return { ...item, opts: newOpts, correct: newCorrect };
}
function buildOrder(){
  return shuffle(QUESTIONS).slice(0, Math.min(QUIZ_LENGTH, QUESTIONS.length)).map(shuffleOptions);
}
function updateProgress(){
  const fill = document.getElementById('progressFill');
  const label = document.getElementById('progressLabel');
  const pct = order.length ? (idx/order.length)*100 : 0;
  fill.style.width = pct + '%';
  label.textContent = Math.min(idx+1, order.length) + ' / ' + order.length;
}
function startQuiz(){
  order = buildOrder();
  idx = 0; score = 0; history = [];
  document.getElementById('poolNote').textContent = `Frågebank: ${QUESTIONS.length} frågor · ${Math.min(QUIZ_LENGTH, QUESTIONS.length)} slumpas ut denna omgång`;
  renderQuestion();
}
function renderQuestion(){
  answered = false;
  updateProgress();
  const card = document.getElementById('card');
  if(idx >= order.length){ renderResult(); return; }
  const item = order[idx];
  const optHtml = item.opts.map((o,i) => {
    const key = String.fromCharCode(65+i);
    return `<button class="opt" data-i="${i}"><span class="k">${key}</span><span>${o}</span></button>`;
  }).join('');
  card.innerHTML = `
    <div class="qmeta">
      <span class="qtag" style="background:var(--page-dim); color:var(--page-accent);">${CAT_LABEL}</span>
      <span class="qnum">Fråga ${idx+1} av ${order.length}</span>
    </div>
    <div class="prompt">${item.q}</div>
    <div class="options">${optHtml}</div>
    <div class="feedback" id="feedback"></div>
    <div class="controls"><button class="next" id="nextBtn" disabled>Nästa</button></div>
  `;
  card.querySelectorAll('.opt').forEach(btn => {
    btn.addEventListener('click', () => selectAnswer(parseInt(btn.dataset.i)));
  });
  document.getElementById('nextBtn').addEventListener('click', () => { idx++; renderQuestion(); });
}
function selectAnswer(i){
  if(answered) return;
  answered = true;
  const item = order[idx];
  const correct = item.correct;
  document.querySelectorAll('.opt').forEach((btn, bi) => {
    btn.setAttribute('disabled','true');
    if(bi === correct) btn.classList.add('correct');
    if(bi === i && i !== correct) btn.classList.add('wrong');
  });
  const isCorrect = (i === correct);
  if(isCorrect) score++;
  history.push({q:item.q, correct:isCorrect, correctText:item.opts[correct]});
  const fb = document.getElementById('feedback');
  fb.classList.add('show', isCorrect ? 'ok' : 'bad');
  fb.innerHTML = `<b>${isCorrect ? 'Rätt!' : 'Inte riktigt.'}</b>${item.fb}`;
  document.getElementById('nextBtn').disabled = false;
}
function renderResult(){
  const card = document.getElementById('card');
  const pct = order.length ? Math.round((score/order.length)*100) : 0;
  const reviewHtml = history.map(h => `
    <div class="review-item ${h.correct ? 'ok' : 'bad'}">
      <div class="q">${h.q}</div>
      <div class="a">${h.correct ? 'Du svarade rätt.' : 'Rätt svar: ' + h.correctText}</div>
    </div>`).join('');
  card.innerHTML = `
    <div class="result">
      <div class="big" style="color:var(--page-accent);">${score} / ${order.length}</div>
      <div class="of">${pct}% rätt</div>
      <button class="restart" id="restartBtn">Kör igen (nya slumpade frågor)</button>
      <div class="review">${reviewHtml}</div>
    </div>`;
  document.getElementById('restartBtn').addEventListener('click', startQuiz);
  document.getElementById('progressFill').style.width = '100%';
  document.getElementById('progressLabel').textContent = order.length + ' / ' + order.length;
}
startQuiz();
</script>
